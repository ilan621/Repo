name: Upload RootHide Plugins

on:
  workflow_dispatch:
    inputs:
      plugin_data:
        description: "Plugin metadata JSON"
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup directories
        run: |
          mkdir -p debs
          mkdir -p icons
          mkdir -p metadata

      - name: Save plugin metadata
        env:
          PLUGIN_DATA: ${{ inputs.plugin_data }}
        run: |
          printf '%s' "$PLUGIN_DATA" > metadata/plugins.json

      - name: Generate Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          python generate_packages.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update RootHide plugins"
            git push
          fi
