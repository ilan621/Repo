name: Update RootHide Packages

on:
  push:
    paths:
      - "debs/**"
      - "icons/**"
      - "metadata/**"
      - "generate_packages.py"
      - ".github/workflows/update-packages.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Packages
        run: |
          python generate_packages.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Packages Packages.bz2 Packages.gz Packages.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update RootHide Packages"
            git push
          fi
