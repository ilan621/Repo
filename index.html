<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f7">
    <title>ilan 插件源</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }
        .container {
            width: min(920px, calc(100% - 32px));
            margin: 0 auto;
            padding: 50px 0 70px;
        }
        .hero {
            text-align: center;
            padding: 35px 20px 45px;
        }
        .icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 20px;
            border-radius: 22px;
            background: #1d1d1f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }
        h1 {
            margin: 0;
            font-size: 38px;
            letter-spacing: -1px;
        }
        .subtitle {
            margin-top: 10px;
            color: #6e6e73;
            font-size: 17px;
        }
        .source-box {
            margin: 0 auto 28px;
            padding: 18px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }
        .source-title {
            font-size: 14px;
            color: #6e6e73;
            margin-bottom: 9px;
        }
        .source-row {
            display: flex;
            gap: 10px;
        }
        .source-url {
            flex: 1;
            min-width: 0;
            padding: 13px 14px;
            border-radius: 12px;
            background: #f5f5f7;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            user-select: all;
        }
        button {
            border: 0;
            border-radius: 12px;
            padding: 0 18px;
            background: #1d1d1f;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        button:active {
            transform: scale(0.97);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 28px;
        }
        .stat {
            background: white;
            border-radius: 18px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
        }
        .stat-number {
            font-size: 27px;
            font-weight: 700;
        }
        .stat-label {
            margin-top: 5px;
            color: #6e6e73;
            font-size: 13px;
        }
        .card {
            background: white;
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
        }
        .card h2 {
            margin: 0 0 16px;
            font-size: 21px;
        }
        .card p {
            margin: 8px 0;
            line-height: 1.7;
            color: #6e6e73;
            font-size: 14px;
        }
        .steps {
            display: grid;
            gap: 12px;
        }
        .step {
            display: flex;
            gap: 13px;
            align-items: flex-start;
        }
        .step-number {
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            border-radius: 50%;
            background: #1d1d1f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
        }
        .step-text {
            padding-top: 3px;
            font-size: 14px;
            line-height: 1.5;
        }
        .plugins {
            display: grid;
            gap: 10px;
        }
        .plugin {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 15px;
            border-radius: 15px;
            background: #f5f5f7;
        }
        .plugin-name {
            font-size: 15px;
            font-weight: 600;
        }
        .plugin-id {
            margin-top: 4px;
            color: #86868b;
            font-size: 12px;
        }
        .plugin-version {
            color: #6e6e73;
            font-size: 13px;
            white-space: nowrap;
        }
        .loading,
        .empty {
            text-align: center;
            padding: 25px;
            color: #6e6e73;
            font-size: 14px;
        }
        footer {
            text-align: center;
            padding-top: 15px;
            color: #86868b;
            font-size: 12px;
        }
        @media (max-width: 600px) {
            .container {
                width: min(100% - 22px, 920px);
                padding-top: 25px;
            }
            .hero {
                padding-top: 25px;
            }
            h1 {
                font-size: 32px;
            }
            .stats {
                grid-template-columns: 1fr;
            }
            .source-row {
                flex-direction: column;
            }
            button {
                height: 44px;
            }
            .plugin {
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <section class="hero">
        <div class="icon">i</div>
        <h1>ilan 插件源</h1>
        <div class="subtitle">
            RootHide / Rootless 越狱插件源
        </div>
    </section>
    <section class="source-box">
        <div class="source-title">源地址</div>
        <div class="source-row">
            <div class="source-url" id="sourceUrl">
                https://ilan621.github.io/
            </div>
            <button onclick="copySource()">
                复制
            </button>
        </div>
    </section>
    <section class="stats">
        <div class="stat">
            <div class="stat-number" id="pluginCount">-</div>
            <div class="stat-label">插件版本</div>
        </div>
        <div class="stat">
            <div class="stat-number">RootHide</div>
            <div class="stat-label">支持环境</div>
        </div>
        <div class="stat">
            <div class="stat-number">APT</div>
            <div class="stat-label">软件源</div>
        </div>
    </section>
    <section class="card">
        <h2>添加源</h2>
        <div class="steps">
            <div class="step">
                <div class="step-number">1</div>
                <div class="step-text">
                    复制上面的源地址
                </div>
            </div>
            <div class="step">
                <div class="step-number">2</div>
                <div class="step-text">
                    打开 Sileo / RootHide
                </div>
            </div>
            <div class="step">
                <div class="step-number">3</div>
                <div class="step-text">
                    添加软件源并刷新
                </div>
            </div>
        </div>
    </section>
    <section class="card">
        <h2>插件</h2>
        <div id="plugins" class="plugins">
            <div class="loading">
                正在读取插件列表……
            </div>
        </div>
    </section>
    <section class="card">
        <h2>关于</h2>
        <p>
            ilan 插件源提供 RootHide / Rootless 越狱环境下的插件。
        </p>
        <p>
            插件版本及信息会根据软件源索引自动更新。
        </p>
    </section>
    <footer>
        © 2026 ilan 插件源
    </footer>
</div>
<script>
const SOURCE_URL = "https://ilan621.github.io/";
function copySource() {
    navigator.clipboard.writeText(SOURCE_URL)
        .then(() => {
            const button = document.querySelector("button");
            const oldText = button.innerText;
            button.innerText = "已复制";
            setTimeout(() => {
                button.innerText = oldText;
            }, 1500);
        })
        .catch(() => {
            alert(SOURCE_URL);
        });
}
/*
 * 读取 Packages
 *
 * 不使用网页上传功能。
 * 首页只负责展示源中的插件。
 */
async function loadPackages() {
    const container = document.getElementById("plugins");
    try {
        const response = await fetch(
            "Packages?ts=" + Date.now(),
            {
                cache: "no-store"
            }
        );
        if (!response.ok) {
            throw new Error("Packages HTTP " + response.status);
        }
        const text = await response.text();
        const entries = text
            .split(/\n\s*\n/)
            .map(x => x.trim())
            .filter(Boolean);
        document.getElementById("pluginCount").innerText =
            entries.length;
        if (!entries.length) {
            container.innerHTML =
                '<div class="empty">暂无插件</div>';
            return;
        }
        /*
         * 每个 Package 只显示一个最新版本，
         * 避免首页出现几十个历史版本。
         */
        const packages = {};
        for (const entry of entries) {
            const data = {};
            entry.split("\n").forEach(line => {
                const index = line.indexOf(":");
                if (index === -1) return;
                const key =
                    line.substring(0, index).trim();
                const value =
                    line.substring(index + 1).trim();
                data[key] = value;
            });
            if (!data.Package) continue;
            if (!packages[data.Package]) {
                packages[data.Package] = data;
            } else {
                /*
                 * 简单按版本字符串比较。
                 * 真正的版本选择仍由 Sileo / APT 负责。
                 */
                if (
                    String(data.Version || "") >
                    String(packages[data.Package].Version || "")
                ) {
                    packages[data.Package] = data;
                }
            }
        }
        const list =
            Object.values(packages);
        document.getElementById("pluginCount").innerText =
            list.length;
        container.innerHTML = "";
        list.forEach(plugin => {
            const item =
                document.createElement("div");
            item.className = "plugin";
            item.innerHTML = `
                <div>
                    <div class="plugin-name">
                        ${escapeHtml(
                            plugin.Name ||
                            plugin.Package
                        )}
                    </div>
                    <div class="plugin-id">
                        ${escapeHtml(plugin.Package)}
                    </div>
                </div>
                <div class="plugin-version">
                    ${escapeHtml(
                        plugin.Version || ""
                    )}
                </div>
            `;
            container.appendChild(item);
        });
    } catch (error) {
        console.error(error);
        container.innerHTML =
            '<div class="empty">暂时无法读取插件列表</div>';
        document.getElementById("pluginCount")
            .innerText = "-";
    }
}
function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
loadPackages();
</script>
</body>
</html>
