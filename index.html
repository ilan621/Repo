<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#111827">

<title>ilan RootHide 源管理器</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
"PingFang SC","Helvetica Neue",Arial,sans-serif;
background:#f3f4f6;
color:#111827
}

.header{
background:linear-gradient(135deg,#111827,#374151);
color:white;
padding:28px 18px 25px
}

.header h1{
margin:0;
font-size:27px
}

.header p{
margin:7px 0 0;
font-size:13px;
opacity:.72
}

.container{
max-width:900px;
margin:auto;
padding:16px
}

.card{
background:white;
border-radius:18px;
padding:18px;
margin-bottom:16px;
box-shadow:0 5px 20px rgba(0,0,0,.06)
}

h2{
font-size:18px;
margin:0 0 15px
}

label{
display:block;
font-size:13px;
font-weight:600;
color:#4b5563;
margin:13px 0 6px
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:12px;
font-size:15px;
background:white;
outline:none
}

textarea{
min-height:85px;
resize:vertical
}

input:focus,textarea:focus{
border-color:#111827
}

.upload{
border:2px dashed #cbd5e1;
border-radius:16px;
padding:25px 15px;
text-align:center;
background:#f8fafc
}

.upload strong{
display:block;
font-size:17px;
margin-bottom:6px
}

.upload span{
font-size:13px;
color:#64748b
}

.btn{
border:0;
border-radius:12px;
padding:13px 17px;
font-size:15px;
font-weight:600;
margin-top:12px;
cursor:pointer
}

.primary{
background:#111827;
color:white;
width:100%
}

.secondary{
background:#e5e7eb;
color:#111827
}

.danger{
background:#fee2e2;
color:#991b1b
}

.plugin{
border:1px solid #e5e7eb;
border-radius:15px;
padding:15px;
margin-top:12px;
background:#fafafa
}

.plugin-title{
font-size:17px;
font-weight:700
}

.small{
font-size:12px;
color:#6b7280;
margin-top:5px
}

.status{
display:none;
padding:13px;
border-radius:12px;
margin-top:12px;
font-size:14px;
line-height:1.6
}

.success{
display:block;
background:#dcfce7;
color:#166534
}

.error{
display:block;
background:#fee2e2;
color:#991b1b
}

.warning{
display:block;
background:#fef3c7;
color:#92400e
}

.progress{
margin-top:15px;
height:8px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
display:none
}

.progress-bar{
height:100%;
width:0%;
background:#111827;
transition:.2s
}

.footer{
text-align:center;
padding:25px 10px;
font-size:12px;
color:#9ca3af
}
</style>
</head>

<body>

<header class="header">
<h1>ilan RootHide 源管理器</h1>
<p>手机批量上传 · 自动管理插件 · GitHub 自动更新源</p>
</header>

<main class="container">

<section class="card">

<h2>🔐 GitHub 设置</h2>

<label>GitHub 用户名</label>
<input id="owner" value="ilan621">

<label>仓库名称</label>
<input id="repo" value="Repo">

<label>GitHub Token</label>
<input
id="token"
type="password"
placeholder="粘贴你的 Fine-grained Token"
>

<div class="small">
Token 只保存在当前网页，不会写入插件源文件。
</div>

</section>


<section class="card">

<h2>📦 批量添加插件</h2>

<div class="upload">

<strong>选择 .deb 文件</strong>

<span>
可以一次选择多个插件
</span>

<input
id="debFiles"
type="file"
accept=".deb"
multiple
>

</div>

<div id="plugins"></div>

</section>


<section class="card">

<h2>🖼️ 批量添加图标</h2>

<div class="upload">

<strong>选择 PNG / JPG 图标</strong>

<span>
文件名建议与插件名称对应
</span>

<input
id="iconFiles"
type="file"
accept="image/png,image/jpeg"
multiple
>

</div>

</section>


<section class="card">

<h2>🚀 上传到 GitHub</h2>

<button
class="btn primary"
onclick="uploadAll()"
>
开始上传插件
</button>

<div class="progress" id="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="status" class="status"></div>

</section>


<section class="card">

<h2>👀 插件列表</h2>

<div id="preview">
<div class="small">还没有添加插件</div>
</div>

</section>

</main>

<footer class="footer">
ilan RootHide Repository
</footer>


<script>

let plugins=[];
let icons=[];


/* =========================
   选择 DEB
========================= */

document.getElementById("debFiles")
.addEventListener("change",async function(e){

plugins=[];

for(const file of e.target.files){

const info=await readDeb(file);

plugins.push({
file:file,
fileName:file.name,
name:info.name || file.name.replace(/\.deb$/i,""),
package:info.package || "",
version:info.version || "1.0.0",
architecture:info.architecture || "iphoneos-arm64",
author:info.author || "ilan",
description:info.description || "",
icon:null
});

}

renderPlugins();
renderPreview();

});


/* =========================
   读取 DEB
========================= */

async function readDeb(file){

/*
  纯浏览器无法可靠解析所有 DEB。
  因此这里先根据文件名生成基础信息。
  上传后 GitHub Actions 再从 DEBIAN/control
  获取准确 Package / Version / Architecture。
*/

let name=file.name
.replace(/\.deb$/i,"")
.replace(/[_-]/g," ");

return{

name:name,
package:"",
version:"1.0.0",
architecture:"iphoneos-arm64",
author:"ilan",
description:name

};

}


/* =========================
   图标
========================= */

document.getElementById("iconFiles")
.addEventListener("change",function(e){

icons=Array.from(e.target.files);

showStatus(
"已选择 "+icons.length+" 个图标",
"success"
);

});


/* =========================
   插件编辑器
========================= */

function renderPlugins(){

const box=document.getElementById("plugins");

box.innerHTML="";

plugins.forEach((p,i)=>{

const div=document.createElement("div");

div.className="plugin";

div.innerHTML=`

<div class="plugin-title">
${escapeHtml(p.fileName)}
</div>

<label>插件名称</label>

<input
value="${escapeHtml(p.name)}"
onchange="update(${i},'name',this.value)"
>

<label>Package ID</label>

<input
placeholder="例如 com.ilan.example"
value="${escapeHtml(p.package)}"
onchange="update(${i},'package',this.value)"
>

<label>版本</label>

<input
value="${escapeHtml(p.version)}"
onchange="update(${i},'version',this.value)"
>

<label>作者</label>

<input
value="${escapeHtml(p.author)}"
onchange="update(${i},'author',this.value)"
>

<label>中文描述</label>

<textarea
onchange="update(${i},'description',this.value)"
>${escapeHtml(p.description)}</textarea>

<button
class="btn danger"
onclick="removePlugin(${i})"
>
删除
</button>

`;

box.appendChild(div);

});

}


/* =========================
   修改
========================= */

function update(index,key,value){

plugins[index][key]=value;

renderPreview();

}


/* =========================
   删除
========================= */

function removePlugin(index){

plugins.splice(index,1);

renderPlugins();
renderPreview();

}


/* =========================
   预览
========================= */

function renderPreview(){

const box=document.getElementById("preview");

if(!plugins.length){

box.innerHTML=
'<div class="small">还没有添加插件</div>';

return;

}

box.innerHTML="";

plugins.forEach(p=>{

const div=document.createElement("div");

div.className="plugin";

div.innerHTML=`

<div class="plugin-title">
${escapeHtml(p.name)}
</div>

<div class="small">
版本：${escapeHtml(p.version)}
<br>
作者：${escapeHtml(p.author)}
<br>
Package：
${escapeHtml(p.package || "上传后自动读取")}
<br>
描述：
${escapeHtml(p.description)}
</div>

`;

box.appendChild(div);

});

}


/* =========================
   上传全部
========================= */

async function uploadAll(){

const owner=
document.getElementById("owner").value.trim();

const repo=
document.getElementById("repo").value.trim();

const token=
document.getElementById("token").value.trim();


if(!owner || !repo || !token){

showStatus(
"请填写 GitHub 用户名、仓库名称和 Token。",
"error"
);

return;

}


if(!plugins.length){

showStatus(
"请先选择至少一个 .deb 插件。",
"warning"
);

return;

}


document.getElementById("progress").style.display="block";

setProgress(0);


try{

for(let i=0;i<plugins.length;i++){

const p=plugins[i];

await uploadFile(
owner,
repo,
token,
"debs/"+p.fileName,
p.file
);

setProgress(
Math.round(
((i+1)/plugins.length)*100
)
);

}


/* 保存插件元数据 */

const metadata=plugins.map(p=>({

name:p.name,

package:p.package,

version:p.version,

architecture:p.architecture,

author:p.author,

description:p.description,

file:p.fileName

}));


await uploadText(
owner,
repo,
token,
"metadata/plugins.json",
JSON.stringify(
metadata,
null,
2
)
);


showStatus(
"🎉 上传完成！GitHub Actions 接下来会自动生成 Packages。",
"success"
);


}catch(error){

console.error(error);

showStatus(
"上传失败："+error.message,
"error"
);

}

}


/* =========================
   上传文件到 GitHub
========================= */

async function uploadFile(
owner,
repo,
token,
path,
file
){

const buffer=
await file.arrayBuffer();

const bytes=
new Uint8Array(buffer);

const base64=
uint8ToBase64(bytes);


return githubPut(
owner,
repo,
token,
path,
base64,
"Add plugin "+file.name
);

}


/* =========================
   上传文本
========================= */

async function uploadText(
owner,
repo,
token,
path,
text
){

const bytes=
new TextEncoder().encode(text);

const base64=
uint8ToBase64(bytes);

return githubPut(
owner,
repo,
token,
path,
base64,
"Update plugin metadata"
);

}


/* =========================
   GitHub API
========================= */

async function githubPut(
owner,
repo,
token,
path,
content,
message
){

const url=
`https://api.github.com/repos/`+
`${encodeURIComponent(owner)}/`+
`${encodeURIComponent(repo)}/contents/`+
path.split("/")
.map(encodeURIComponent)
.join("/");


/*
  如果文件已经存在，先取得 SHA。
*/

let sha=null;

const getResponse=
await fetch(url,{

headers:{
"Authorization":
"Bearer "+token,

"Accept":
"application/vnd.github+json"
}

});


if(getResponse.ok){

const old=
await getResponse.json();

sha=old.sha;

}


const body={
message:message,
content:content
};

if(sha){

body.sha=sha;

}


const response=
await fetch(url,{

method:"PUT",

headers:{

"Authorization":
"Bearer "+token,

"Accept":
"application/vnd.github+json",

"Content-Type":
"application/json"

},

body:JSON.stringify(body)

});


if(!response.ok){

const text=
await response.text();

throw new Error(
response.status+" "+text
);

}


return response.json();

}


/* =========================
   Base64
========================= */

function uint8ToBase64(bytes){

let binary="";

const chunk=0x8000;

for(
let i=0;
i<bytes.length;
i+=chunk
){

binary+=String.fromCharCode(
...bytes.subarray(
i,
Math.min(i+chunk,bytes.length)
)
);

}

return btoa(binary);

}


/* =========================
   进度
========================= */

function setProgress(value){

document.getElementById(
"progressBar"
).style.width=value+"%";

}


/* =========================
   提示
========================= */

function showStatus(text,type){

const box=
document.getElementById("status");

box.className=
"status "+type;

box.textContent=text;

}


/* =========================
   HTML 安全
========================= */

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
