<script>


/* =====================================================
   全局变量
===================================================== */

let selectedFiles = [];

let plugins = [];


/* =====================================================
   初始化
===================================================== */

window.addEventListener(
    "load",
    () => {

        loadSettings();

    }
);


/* =====================================================
   日志
===================================================== */

function log(text){

    const box =
        document.getElementById(
            "status"
        );

    box.innerText +=
        "\n" + text;

    box.scrollTop =
        box.scrollHeight;
}


/* =====================================================
   GitHub 设置
===================================================== */

function loadSettings(){

    const token =
        localStorage.getItem(
            "ilan_token"
        );

    const user =
        localStorage.getItem(
            "ilan_user"
        );

    const repo =
        localStorage.getItem(
            "ilan_repo"
        );

    const branch =
        localStorage.getItem(
            "ilan_branch"
        );


    if(token){

        document.getElementById(
            "token"
        ).value = token;

        document.getElementById(
            "tokenStatus"
        ).innerText =
            "✅ Token 已保存，本机下次无需重新输入";
    }


    if(user){

        document.getElementById(
            "githubUser"
        ).value = user;
    }


    if(repo){

        document.getElementById(
            "githubRepo"
        ).value = repo;
    }


    if(branch){

        document.getElementById(
            "githubBranch"
        ).value = branch;
    }

}


function saveSettings(){

    const token =
        document.getElementById(
            "token"
        ).value.trim();

    const user =
        document.getElementById(
            "githubUser"
        ).value.trim();

    const repo =
        document.getElementById(
            "githubRepo"
        ).value.trim();

    const branch =
        document.getElementById(
            "githubBranch"
        ).value.trim()
        || "main";


    if(!token){

        alert(
            "请输入 GitHub Token"
        );

        return;
    }


    if(!user || !repo){

        alert(
            "请填写 GitHub 用户名和仓库名称"
        );

        return;
    }


    localStorage.setItem(
        "ilan_token",
        token
    );

    localStorage.setItem(
        "ilan_user",
        user
    );

    localStorage.setItem(
        "ilan_repo",
        repo
    );

    localStorage.setItem(
        "ilan_branch",
        branch
    );


    document.getElementById(
        "tokenStatus"
    ).innerText =
        "✅ 设置已保存";


    log(
        "GitHub 设置保存成功"
    );

}


function clearToken(){

    localStorage.removeItem(
        "ilan_token"
    );


    document.getElementById(
        "token"
    ).value = "";


    document.getElementById(
        "tokenStatus"
    ).innerText =
        "Token 已清除";


    log(
        "已清除本机 Token"
    );

}


/* =====================================================
   文件选择
===================================================== */

document
.getElementById("files")
.addEventListener(
    "change",
    function(e){

        selectedFiles =
            Array.from(
                e.target.files
            );


        const debs =
            selectedFiles.filter(
                f =>
                    /\.deb$/i.test(
                        f.name
                    )
            );


        const images =
            selectedFiles.filter(
                f =>
                    /\.(png|jpg|jpeg)$/i.test(
                        f.name
                    )
            );


        document.getElementById(
            "fileInfo"
        ).innerText =

            `总文件：${selectedFiles.length}\n` +

            `DEB：${debs.length}\n` +

            `图片：${images.length}`;

    }
);


/* =====================================================
   DEB AR
===================================================== */

function parseAR(buffer){

    const bytes =
        new Uint8Array(
            buffer
        );


    const magic =
        new TextDecoder(
            "ascii"
        ).decode(
            bytes.slice(
                0,
                8
            )
        );


    if(
        magic !== "!<arch>\n"
    ){

        throw new Error(
            "不是有效的 DEB 文件"
        );
    }


    let offset = 8;

    const files = [];


    while(
        offset + 60 <=
        bytes.length
    ){

        const header =
            bytes.slice(
                offset,
                offset + 60
            );


        const name =
            new TextDecoder(
                "ascii"
            ).decode(
                header.slice(
                    0,
                    16
                )
            ).trim();


        const sizeText =
            new TextDecoder(
                "ascii"
            ).decode(
                header.slice(
                    48,
                    58
                )
            ).trim();


        const size =
            parseInt(
                sizeText,
                10
            );


        if(
            !Number.isFinite(size)
            ||
            size < 0
        ){

            break;
        }


        const start =
            offset + 60;

        const end =
            start + size;


        if(
            end >
            bytes.length
        ){

            break;
        }


        files.push({

            name,

            data:
                bytes.slice(
                    start,
                    end
                )

        });


        offset = end;


        if(
            offset % 2 !== 0
        ){

            offset++;
        }

    }


    return files;

}


/* =====================================================
   gzip
===================================================== */

async function gzipDecode(bytes){

    if(
        typeof DecompressionStream ===
        "undefined"
    ){

        throw new Error(
            "当前浏览器不支持 gzip 解压"
        );
    }


    const stream =
        new Blob([
            bytes
        ])
        .stream()
        .pipeThrough(
            new DecompressionStream(
                "gzip"
            )
        );


    return new Uint8Array(
        await new Response(
            stream
        ).arrayBuffer()
    );

}


/* =====================================================
   TAR
===================================================== */

function parseTar(bytes){

    const files = [];

    let offset = 0;


    while(
        offset + 512 <=
        bytes.length
    ){

        const header =
            bytes.slice(
                offset,
                offset + 512
            );


        let empty = true;


        for(
            let i = 0;
            i < 512;
            i++
        ){

            if(
                header[i] !== 0
            ){

                empty = false;

                break;
            }

        }


        if(empty){

            break;
        }


        const name =
            new TextDecoder(
                "utf-8"
            )
            .decode(
                header.slice(
                    0,
                    100
                )
            )
            .replace(
                /\0/g,
                ""
            )
            .trim();


        const sizeText =
            new TextDecoder(
                "ascii"
            )
            .decode(
                header.slice(
                    124,
                    136
                )
            )
            .replace(
                /\0/g,
                ""
            )
            .trim();


        const size =
            parseInt(
                sizeText,
                8
            ) || 0;


        const type =
            header[156];


        const start =
            offset + 512;


        const end =
            start + size;


        if(
            end >
            bytes.length
        ){

            break;
        }


        if(
            type === 0 ||
            type === 48
        ){

            files.push({

                name,

                data:
                    bytes.slice(
                        start,
                        end
                    )

            });

        }


        offset =
            start +
            Math.ceil(
                size / 512
            ) *
            512;

    }


    return files;

}


/* =====================================================
   提取 control
===================================================== */

async function extractControl(
    debFile
){

    const buffer =
        await debFile.arrayBuffer();


    const ar =
        parseAR(buffer);


    const control =
        ar.find(
            x =>
                /^control\.tar/i.test(
                    x.name
                )
        );


    if(!control){

        throw new Error(
            "DEB 中没有找到 control.tar.*"
        );
    }


    let tarBytes =
        control.data;


    const name =
        control.name.toLowerCase();


    if(
        name.includes(".gz")
    ){

        tarBytes =
            await gzipDecode(
                tarBytes
            );
    }


    if(
        name.includes(".xz")
    ){

        throw new Error(
            "检测到 control.tar.xz，当前浏览器暂不支持 XZ"
        );
    }


    if(
        name.includes(".zst")
    ){

        throw new Error(
            "检测到 control.tar.zst，当前浏览器暂不支持 Zstandard"
        );
    }


    const files =
        parseTar(
            tarBytes
        );


    const controlFile =
        files.find(
            x =>
                x.name === "control" ||
                x.name === "./control" ||
                x.name.endsWith(
                    "/control"
                )
        );


    if(!controlFile){

        throw new Error(
            "control.tar 中没有找到 control 文件"
        );
    }


    return new TextDecoder(
        "utf-8"
    ).decode(
        controlFile.data
    );

}


/* =====================================================
   Debian control
===================================================== */

function parseControl(text){

    const result = {};

    const lines =
        text
        .replace(
            /\r/g,
            ""
        )
        .split("\n");


    let current = null;


    for(
        const line of lines
    ){

        if(
            !line.trim()
        ){

            continue;
        }


        if(
            /^[ \t]/.test(line)
            &&
            current
        ){

            result[current] +=
                "\n" +
                line.trim();

            continue;
        }


        const index =
            line.indexOf(":");


        if(
            index === -1
        ){

            continue;
        }


        const key =
            line.slice(
                0,
                index
            ).trim();


        const value =
            line.slice(
                index + 1
            ).trim();


        current = key;


        result[key] =
            value;

    }


    return result;

}


/* =====================================================
   描述清理
===================================================== */

function cleanDescription(
    text
){

    return text

        .replace(
            /\n[ \t]*\.[ \t]*/g,
            "\n"
        )

        .replace(
            /\n[ \t]+/g,
            "\n"
        )

        .trim();

}


/* =====================================================
   分析 DEB
===================================================== */

async function analyzeDeb(
    file
){

    const text =
        await extractControl(
            file
        );


    const control =
        parseControl(
            text
        );


    return {

        package:
            control.Package || "",

        name:
            control.Name ||
            control.Package ||
            "",

        version:
            control.Version || "",

        author:
            control.Author ||
            control.Maintainer ||
            "",

        description:
            cleanDescription(
                control.Description ||
                ""
            ),

        architecture:
            control.Architecture ||
            ""

    };

}


/* =====================================================
   查找图标
===================================================== */

function findImage(
    deb
){

    const base =
        deb.name
        .replace(
            /\.deb$/i,
            ""
        )
        .toLowerCase();


    return selectedFiles.find(
        file => {

            const name =
                file.name
                .replace(
                    /\.(png|jpg|jpeg)$/i,
                    ""
                )
                .toLowerCase();


            return name === base;

        }
    );

}


/* =====================================================
   分析文件
===================================================== */

async function analyzeFiles(){

    const debs =
        selectedFiles.filter(
            f =>
                /\.deb$/i.test(
                    f.name
                )
        );


    if(!debs.length){

        alert(
            "请选择 DEB 文件"
        );

        return;
    }


    plugins = [];


    document.getElementById(
        "plugins"
    ).innerHTML =
        "正在读取插件信息...";


    log(
        `开始解析 ${debs.length} 个 DEB`
    );


    for(
        const deb of debs
    ){

        try{

            log(
                `\n读取：${deb.name}`
            );


            const info =
                await analyzeDeb(
                    deb
                );


            const image =
                findImage(
                    deb
                );


            plugins.push({

                deb,

                image,

                original:{

                    package:
                        info.package,

                    name:
                        info.name,

                    version:
                        info.version,

                    author:
                        info.author,

                    description:
                        info.description,

                    architecture:
                        info.architecture

                },

                package:
                    info.package,

                name:
                    info.name,

                version:
                    info.version,

                author:
                    info.author,

                description:
                    info.description,

                architecture:
                    info.architecture

            });


            log(
                `✅ ${info.name} ${info.version}`
            );


        }catch(error){

            log(
                `❌ ${deb.name}\n` +
                error.message
            );

        }

    }


    renderPlugins();


    document.getElementById(
        "uploadButton"
    ).disabled =
        plugins.length === 0;


    log(
        `\n解析完成：${plugins.length} 个插件`
    );

}


/* =====================================================
   HTML 安全
===================================================== */

function escapeHTML(
    value
){

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   插件界面
===================================================== */

function renderPlugins(){

    const box =
        document.getElementById(
            "plugins"
        );


    box.innerHTML = "";


    plugins.forEach(
        (plugin,index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "plugin";


            let iconHTML =
                `<div class="icon"></div>`;


            if(plugin.image){

                const url =
                    URL.createObjectURL(
                        plugin.image
                    );


                iconHTML =
                    `<img
                        id="icon-${index}"
                        class="icon"
                        src="${url}"
                    >`;

            }


            div.innerHTML = `

                <div class="pluginTop">

                    ${iconHTML}

                    <div>

                        <div class="pluginTitle">

                            ${escapeHTML(
                                plugin.name
                            )}

                        </div>

                        <div class="small">

                            ${escapeHTML(
                                plugin.package
                            )}

                        </div>

                        <div class="badge">

                            ${escapeHTML(
                                plugin.version
                            )}

                        </div>

                    </div>

                </div>


                <div class="field">

                    <label>
                        插件名称
                    </label>

                    <input
                        id="name-${index}"
                        value="${escapeHTML(
                            plugin.name
                        )}"
                    >

                </div>


                <div class="field">

                    <label>
                        Package ID
                    </label>

                    <input
                        id="package-${index}"
                        value="${escapeHTML(
                            plugin.package
                        )}"
                    >

                </div>


                <div class="field">

                    <label>
                        版本
                    </label>

                    <input
                        id="version-${index}"
                        value="${escapeHTML(
                            plugin.version
                        )}"
                    >

                    <div class="auto">
                        使用 DEB 原始版本最安全
                    </div>

                </div>


                <div class="field">

                    <label>
                        作者 / Maintainer
                    </label>

                    <input
                        id="author-${index}"
                        value="${escapeHTML(
                            plugin.author
                        )}"
                    >

                </div>


                <div class="field">

                    <label>
                        架构
                    </label>

                    <input
                        id="arch-${index}"
                        value="${escapeHTML(
                            plugin.architecture
                        )}"
                    >

                </div>


                <div class="field">

                    <label>
                        📝 插件描述
                    </label>

                    <textarea
                        id="description-${index}"
                    >${escapeHTML(
                        plugin.description
                    )}</textarea>

                    <div class="auto">
                        可以直接修改成中文介绍
                    </div>

                </div>


                <div class="field">

                    <label>
                        🖼️ 更换插件图标
                    </label>

                    <input
                        type="file"
                        accept=".png,.jpg,.jpeg"
                        onchange="changeIcon(
                            ${index},
                            this
                        )"
                    >

                </div>


                <button
                    class="secondary"
                    onclick="restorePlugin(
                        ${index}
                    )"
                >

                    ↩️ 恢复 DEB 原始信息

                </button>

            `;


            box.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   更换图标
===================================================== */

function changeIcon(
    index,
    input
){

    const file =
        input.files[0];


    if(!file){

        return;
    }


    plugins[index].image =
        file;


    const oldIcon =
        document.getElementById(
            `icon-${index}`
        );


    const url =
        URL.createObjectURL(
            file
        );


    if(oldIcon){

        oldIcon.src =
            url;

    }else{

        renderPlugins();

    }


    log(
        `🖼️ 已更换 ${
            plugins[index].name
        } 图标`
    );

}


/* =====================================================
   恢复
===================================================== */

function restorePlugin(
    index
){

    const original =
        plugins[index].original;


    plugins[index].package =
        original.package;


    plugins[index].name =
        original.name;


    plugins[index].version =
        original.version;


    plugins[index].author =
        original.author;


    plugins[index].description =
        original.description;


    plugins[index].architecture =
        original.architecture;


    renderPlugins();


    log(
        `↩️ 已恢复 ${
            original.name
        } 原始信息`
    );

}


/* =====================================================
   获取编辑内容
===================================================== */

function collectEditedData(){

    plugins.forEach(
        (plugin,index) => {

            plugin.name =
                document.getElementById(
                    `name-${index}`
                ).value.trim();


            plugin.package =
                document.getElementById(
                    `package-${index}`
                ).value.trim();


            plugin.version =
                document.getElementById(

/* =====================================================
   GitHub API
===================================================== */

async function githubRequest(
    url,
    options = {}
){

    const token =
        localStorage.getItem(
            "ilan_token"
        );


    if(!token){

        throw new Error(
            "没有找到 GitHub Token"
        );
    }


    const headers = {

        "Authorization":
            `Bearer ${token}`,

        "Accept":
            "application/vnd.github+json",

        "X-GitHub-Api-Version":
            "2022-11-28"

    };


    if(options.body){

        headers[
            "Content-Type"
        ] =
            "application/json";

    }


    const response =
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );


    if(!response.ok){

        let message = "";


        try{

            const data =
                await response.json();


            message =
                data.message ||
                JSON.stringify(
                    data
                );

        }catch(e){

            message =
                await response.text();

        }


        throw new Error(
            `GitHub ${response.status}: ` +
            message
        );

    }


    return response.json();

}


/* =====================================================
   Base64
===================================================== */

function arrayBufferToBase64(
    buffer
){

    const bytes =
        new Uint8Array(
            buffer
        );


    let binary = "";


    const chunk =
        0x8000;


    for(
        let i = 0;
        i < bytes.length;
        i += chunk
    ){

        binary +=
            String.fromCharCode(
                ...bytes.slice(
                    i,
                    i + chunk
                )
            );

    }


    return btoa(
        binary
    );

}


/* =====================================================
   Base64 → UTF8
===================================================== */

function base64ToUtf8(
    base64
){

    const binary =
        atob(
            base64.replace(
                /\n/g,
                ""
            )
        );


    const bytes =
        Uint8Array.from(
            binary,
            c =>
                c.charCodeAt(0)
        );


    return new TextDecoder(
        "utf-8"
    ).decode(
        bytes
    );

}


/* =====================================================
   上传文件
===================================================== */

async function uploadFile(
    path,
    file,
    message
){

    const user =
        document.getElementById(
            "githubUser"
        ).value.trim();


    const repo =
        document.getElementById(
            "githubRepo"
        ).value.trim();


    const branch =
        document.getElementById(
            "githubBranch"
        ).value.trim()
        || "main";


    if(!user || !repo){

        throw new Error(
            "GitHub 用户名或仓库名称为空"
        );

    }


    const url =
        `https://api.github.com/repos/` +
        `${user}/${repo}/contents/${path}`;


    const content =
        arrayBufferToBase64(
            await file.arrayBuffer()
        );


    let sha = null;


    /*
     * 只检查完全相同的路径
     *
     * ~48 与 ~50 是两个不同文件
     */

    try{

        const old =
            await githubRequest(
                `${url}?ref=` +
                encodeURIComponent(
                    branch
                )
            );


        if(
            old &&
            old.sha
        ){

            sha =
                old.sha;

        }

    }catch(error){

        /*
         * 404 = 文件不存在
         * 正常创建
         */

        if(
            !String(
                error.message
            ).includes(
                "GitHub 404"
            )
        ){

            throw error;

        }

    }


    const body = {

        message,

        content,

        branch

    };


    /*
     * 文件已经存在
     * 才使用 sha 更新
     */

    if(sha){

        body.sha =
            sha;

    }


    return githubRequest(
        url,
        {

            method:"PUT",

            body:
                JSON.stringify(
                    body
                )

        }
    );

}


/* =====================================================
   上传 JSON
===================================================== */

async function uploadJSON(
    path,
    data,
    message
){

    const user =
        document.getElementById(
            "githubUser"
        ).value.trim();


    const repo =
        document.getElementById(
            "githubRepo"
        ).value.trim();


    const branch =
        document.getElementById(
            "githubBranch"
        ).value.trim()
        || "main";


    const url =
        `https://api.github.com/repos/` +
        `${user}/${repo}/contents/${path}`;


    const bytes =
        new TextEncoder().encode(
            JSON.stringify(
                data,
                null,
                2
            )
        );


    const content =
        arrayBufferToBase64(
            bytes
        );


    let sha = null;


    try{

        const old =
            await githubRequest(
                `${url}?ref=` +
                encodeURIComponent(
                    branch
                )
            );


        if(
            old &&
            old.sha
        ){

            sha =
                old.sha;

        }

    }catch(error){

        if(
            !String(
                error.message
            ).includes(
                "GitHub 404"
            )
        ){

            throw error;

        }

    }


    const body = {

        message,

        content,

        branch

    };


    if(sha){

        body.sha =
            sha;

    }


    return githubRequest(
        url,
        {

            method:"PUT",

            body:
                JSON.stringify(
                    body
                )

        }
    );

}


/* =====================================================
   读取 GitHub 原有 packages.json
===================================================== */

async function loadExistingPackages(){

    const user =
        document.getElementById(
            "githubUser"
        ).value.trim();


    const repo =
        document.getElementById(
            "githubRepo"
        ).value.trim();


    const branch =
        document.getElementById(
            "githubBranch"
        ).value.trim()
        || "main";


    const url =
        `https://api.github.com/repos/` +
        `${user}/${repo}/contents/packages.json?ref=` +
        encodeURIComponent(
            branch
        );


    try{

        const old =
            await githubRequest(
                url
            );


        if(
            !old ||
            !old.content
        ){

            return [];

        }


        const text =
            base64ToUtf8(
                old.content
            );


        const data =
            JSON.parse(
                text
            );


        if(
            data &&
            Array.isArray(
                data.packages
            )
        ){

            return data.packages;

        }


        return [];


    }catch(error){

        /*
         * packages.json 不存在
         * 第一次上传正常
         */

        if(
            String(
                error.message
            ).includes(
                "GitHub 404"
            )
        ){

            return [];

        }


        throw error;

    }

}


/* =====================================================
   合并 metadata
   ⭐ Package + Version
===================================================== */

function mergePackages(
    oldPackages,
    newPackages
){

    const merged = [
        ...oldPackages
    ];


    for(
        const newItem of newPackages
    ){

        const newPackage =
            newItem.package || "";


        const newVersion =
            newItem.version || "";


        const index =
            merged.findIndex(
                item => {

                    const oldPackage =
                        item.package ||
                        item.Package ||
                        "";


                    const oldVersion =
                        item.version ||
                        item.Version ||
                        "";


                    return (
                        oldPackage ===
                        newPackage
                    )
                    &&
                    (
                        oldVersion ===
                        newVersion
                    );

                }
            );


        if(index >= 0){

            log(
                `♻️ 更新 metadata：` +
                `${newPackage} ` +
                `${newVersion}`
            );


            merged[index] =
                newItem;

        }else{

            log(
                `➕ 添加版本：` +
                `${newPackage} ` +
                `${newVersion}`
            );


            merged.push(
                newItem
            );

        }

    }


    return merged;

}

            "ilan_token"

    }

        document.getElementById(
            "githubUser"
        ).value.trim();


    const repo =
        document.getElementById(
            "githubRepo"
        ).value.trim();


    const branch =
        document.getElementById(

        ).value.trim()
        || "main";

        );

        return;

    }


    /*

    log(

    );

        "🚀 开始上传"
    );


    log(
        "================================"
    );


    const packages = [];


    try{

        /*
         * ==========================================
         * 上传每一个插件
         * ==========================================
         */

        for(
            let i = 0;
            i < plugins.length;
            i++
        ){

            const plugin =
                plugins[i];


            log(
                `\n[${i + 1}/${plugins.length}] ` +
                `${plugin.name}`
            );


            log(
                `Package: ${plugin.package}`
            );


            log(
                `Version: ${plugin.version}`
            );


            log(

            /*

            const debPath =
                `debs/${plugin.deb.name}`;

            await uploadFile(
                debPath,
                plugin.deb,

            );


            log(

            );


            /*
             * 图标

                    plugin.image,

                );


                log(
                    "✅ 图标上传成功"
                );

            }


            /*
             * metadata
             */

            packages.push({

                package:
                    plugin.package,

                name:
                    plugin.name,

                version:
                    plugin.version,

                author:
                    plugin.author,

                description:
                    plugin.description,

                architecture:
                    plugin.architecture,

                filename:
                    debPath,

                icon:
                    iconPath

            });


            log(
                `✅ ${plugin.name} ${plugin.version} 完成`
            );

        }


        /*
         * ==========================================
         * 读取旧 packages.json
         * ==========================================
         */

        log(
            "\n📖 读取旧 packages.json..."
        );


        const oldPackages =
            await loadExistingPackages();


        log(
            `旧 metadata：${oldPackages.length} 个版本`
        );


        /*
         * ==========================================
         * 合并
         * ==========================================
         */

        const merged =
            mergePackages(
                oldPackages,
                packages
            );


        /*
         * ==========================================
         * 生成新的 packages.json
         * ==========================================
         */

        const data = {

            source:{

                name:
                    "ilan",

                description:
                    "ilan RootHide 插件源",

                    "https://ilan621.github.io/Repo/"

            },

            packages:
                merged

        };


        log(
            "\n📄 更新 packages.json..."
        );


        await uploadJSON(

            data,

        );


        log(
            "✅ packages.json 更新成功"
        );

         * 完成
         * ==========================================
         */

        log(
            "\n================================"
        );


        log(
            "🎉 全部上传成功！"
        );


        log(
            `本次上传：${packages.length} 个`
        );


        log(
            `源内版本：${merged.length} 个`
        );


        log(
            "================================"
        );


        log(
            "\n⏳ GitHub Actions 将自动生成："
        );


        log(
            "Packages"
        );


        log(
            "Packages.gz"
        );


        log(
            "Packages.bz2"
        );


        log(
            "Packages.json"
        );


        log(
            "Release"
        );


        alert(
            "🎉 插件上传成功！\n\n" +
            "请等待 GitHub Actions 自动更新源。"
        );


    }catch(error){

        console.error(
            error
        );


        log(
            "\n================================"
        );


        log(
            "❌ 上传失败"
        );


        log(
            "================================"
        );


        log(
            error.message
        );


        log(
            "\n请根据上面的 GitHub 错误判断问题。"
        );


        alert(
            "❌ 上传失败！\n\n" +

        );


    }finally{

    }
