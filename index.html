<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>ilan 插件源生成器</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont,
                 "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f7;
    color: #111;
}

.container {
    max-width: 720px;
    margin: auto;
}

h1 {
    text-align: center;
    margin: 10px 0 6px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 14px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: 600;
    background: #007aff;
    color: white;
}

button.secondary {
    background: #e9e9ed;
    color: #111;
}

button.danger {
    background: #ff3b30;
}

button:disabled {
    opacity: .5;
}

.fileButton {
    display: block;
    text-align: center;
    padding: 15px;
    border-radius: 13px;
    background: #007aff;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.fileButton input {
    display: none;
}

.plugin {
    border: 1px solid #eee;
    border-radius: 15px;
    padding: 14px;
    margin-top: 12px;
}

.pluginHeader {
    display: flex;
    align-items: center;
    gap: 12px;
}

.icon {
    width: 55px;
    height: 55px;
    border-radius: 13px;
    object-fit: cover;
    background: #eee;
}

.pluginName {
    font-size: 17px;
    font-weight: 700;
}

.small {
    color: #777;
    font-size: 13px;
    margin-top: 3px;
}

.status {
    white-space: pre-wrap;
    background: #111;
    color: #0f0;
    border-radius: 12px;
    padding: 13px;
    font-family: monospace;
    font-size: 12px;
    max-height: 280px;
    overflow: auto;
}

.hidden {
    display: none;
}

.success {
    color: #34c759;
    font-weight: 600;
}

.warning {
    color: #ff9500;
}

.info {
    color: #007aff;
}
</style>
</head>

<body>

<div class="container">

<h1>ilan 插件源生成器</h1>
<div class="subtitle">
手机批量上传 RootHide 插件
</div>

<!-- GitHub 设置 -->
<div class="card">

<h3>⚙️ GitHub 设置</h3>

<label>GitHub 用户名</label>
<input id="githubUser"
       placeholder="例如 ilan621">

<br><br>

<label>仓库名称</label>
<input id="githubRepo"
       placeholder="例如 Repo">

<br><br>

<label>分支</label>
<input id="githubBranch"
       value="main">

<br><br>

<label>GitHub Token</label>
<input id="token"
       type="password"
       placeholder="第一次输入即可">

<button onclick="saveToken()">
保存 Token
</button>

<button class="secondary"
        onclick="clearToken()">
清除本机 Token
</button>

<div id="tokenStatus"
     class="small">
</div>

</div>


<!-- 上传 -->
<div class="card">

<h3>📦 批量上传插件</h3>

<label class="fileButton">
选择 DEB + PNG
<input id="files"
       type="file"
       multiple
       accept=".deb,.png,.jpg,.jpeg">
</label>

<div id="fileInfo"
     class="small">
尚未选择文件
</div>

<button onclick="analyzeFiles()">
🔍 读取插件信息
</button>

</div>


<!-- 插件列表 -->
<div class="card">

<h3>📋 插件列表</h3>

<div id="plugins">
暂无插件
</div>

<button id="uploadButton"
        onclick="uploadAll()"
        disabled>
🚀 批量上传到 GitHub
</button>

</div>


<!-- 日志 -->
<div class="card">

<h3>📜 操作日志</h3>

<div id="status"
     class="status">
等待操作...
</div>

</div>

</div>


<script>

/* =========================================================
   全局变量
========================================================= */

let selectedFiles = [];
let plugins = [];


/* =========================================================
   初始化
========================================================= */

window.addEventListener("load", () => {

    const token = localStorage.getItem("ilan_github_token");

    if (token) {
        document.getElementById("token").value = token;

        document.getElementById("tokenStatus").innerHTML =
            "✅ Token 已保存，下次打开无需重新输入";
    }

    const user = localStorage.getItem("ilan_github_user");
    const repo = localStorage.getItem("ilan_github_repo");
    const branch = localStorage.getItem("ilan_github_branch");

    if (user)
        document.getElementById("githubUser").value = user;

    if (repo)
        document.getElementById("githubRepo").value = repo;

    if (branch)
        document.getElementById("githubBranch").value = branch;

});


/* =========================================================
   Token 保存
========================================================= */

function saveToken() {

    const token =
        document.getElementById("token").value.trim();

    const user =
        document.getElementById("githubUser").value.trim();

    const repo =
        document.getElementById("githubRepo").value.trim();

    const branch =
        document.getElementById("githubBranch").value.trim();

    if (!token) {
        alert("请输入 GitHub Token");
        return;
    }

    localStorage.setItem(
        "ilan_github_token",
        token
    );

    localStorage.setItem(
        "ilan_github_user",
        user
    );

    localStorage.setItem(
        "ilan_github_repo",
        repo
    );

    localStorage.setItem(
        "ilan_github_branch",
        branch
    );

    document.getElementById("tokenStatus").innerHTML =
        "✅ Token 已保存到本机浏览器";

    log("Token 已保存。以后无需重复输入。");
}


/* =========================================================
   清除 Token
========================================================= */

function clearToken() {

    localStorage.removeItem(
        "ilan_github_token"
    );

    document.getElementById("token").value = "";

    document.getElementById("tokenStatus").innerHTML =
        "Token 已清除";

    log("已清除本机 Token。");
}


/* =========================================================
   文件选择
========================================================= */

document.getElementById("files")
.addEventListener("change", function(e) {

    selectedFiles = Array.from(e.target.files);

    const debs =
        selectedFiles.filter(
            f => f.name.toLowerCase().endsWith(".deb")
        );

    const images =
        selectedFiles.filter(
            f => /\.(png|jpg|jpeg)$/i.test(f.name)
        );

    document.getElementById("fileInfo").innerText =
        `已选择 ${selectedFiles.length} 个文件\n` +
        `DEB：${debs.length}\n` +
        `图片：${images.length}`;

});


/* =========================================================
   日志
========================================================= */

function log(text) {

    const box =
        document.getElementById("status");

    box.innerText +=
        "\n" + text;

    box.scrollTop =
        box.scrollHeight;
}


/* =========================================================
   DEB 解析
========================================================= */

async function analyzeDeb(file) {

    const buffer =
        await file.arrayBuffer();

    const bytes =
        new Uint8Array(buffer);

    /*
       简化版 DEB 解析：

       .deb 是 ar archive：

       !<arch>
       debian-binary
       control.tar.*
       data.tar.*
    */

    const text =
        new TextDecoder("latin1")
        .decode(bytes);

    const controlIndex =
        text.indexOf("control.tar");

    if (controlIndex === -1) {

        return {
            package: file.name
                .replace(".deb",""),

            name: file.name
                .replace(".deb",""),

            version: "未知",

            author: "未知",

            description:
                "未读取到 DEBIAN/control"
        };

    }

    /*
       浏览器无法直接依赖系统 tar。
       这里先从二进制中寻找 control 文件常见字段。
    */

    const fullText =
        new TextDecoder("utf-8",
        {fatal:false})
        .decode(bytes);

    function findField(field) {

        const regex =
            new RegExp(
                "(?:^|\\n)" +
                field +
                "\\s*:\\s*(.*)",
                "i"
            );

        const match =
            fullText.match(regex);

        return match
            ? match[1].trim()
            : "";
    }

    const pkg =
        findField("Package");

    const name =
        findField("Name");

    const version =
        findField("Version");

    const author =
        findField("Author") ||
        findField("Maintainer");

    const description =
        findField("Description");

    return {

        package:
            pkg ||
            file.name
                .replace(/\.deb$/i,""),

        name:
            name ||
            pkg ||
            file.name
                .replace(/\.deb$/i,""),

        version:
            version ||
            "1.0.0",

        author:
            author ||
            "未知",

        description:
            description ||
            "暂无插件描述"
    };

}


/* =========================================================
   查找对应图片
========================================================= */

function findImage(debFile) {

    const base =
        debFile.name
        .replace(/\.deb$/i,"")
        .toLowerCase();

    return selectedFiles.find(file => {

        const name =
            file.name
            .replace(/\.(png|jpg|jpeg)$/i,"")
            .toLowerCase();

        return name === base;

    });

}


/* =========================================================
   分析全部插件
========================================================= */

async function analyzeFiles() {

    const debs =
        selectedFiles.filter(
            f =>
            f.name
            .toLowerCase()
            .endsWith(".deb")
        );

    if (!debs.length) {

        alert("请先选择 DEB 文件");

        return;
    }

    plugins = [];

    document.getElementById("plugins").innerHTML =
        "正在读取插件信息...";

    log(
        `开始读取 ${debs.length} 个插件`
    );

    for (const deb of debs) {

        log(
            `正在读取：${deb.name}`
        );

        const info =
            await analyzeDeb(deb);

        const image =
            findImage(deb);

        plugins.push({

            deb,

            image,

            package: info.package,

            name: info.name,

            version: info.version,

            author: info.author,

            description: info.description

        });

    }

    renderPlugins();

    document.getElementById(
        "uploadButton"
    ).disabled = false;

    log(
        `✅ 已读取 ${plugins.length} 个插件`
    );

}


/* =========================================================
   显示插件
========================================================= */

function renderPlugins() {

    const box =
        document.getElementById("plugins");

    box.innerHTML = "";

    plugins.forEach((plugin,index) => {

        const div =
            document.createElement("div");

        div.className =
            "plugin";

        let imageHTML = "";

        if (plugin.image) {

            const url =
                URL.createObjectURL(
                    plugin.image
                );

            imageHTML =
                `<img class="icon"
                      src="${url}">`;

        } else {

            imageHTML =
                `<div class="icon"></div>`;

        }

        div.innerHTML = `

            <div class="pluginHeader">

                ${imageHTML}

                <div>

                    <div class="pluginName">
                        ${escapeHTML(plugin.name)}
                    </div>

                    <div class="small">
                        ${escapeHTML(plugin.package)}
                    </div>

                </div>

            </div>

            <br>

            <div class="small">
                作者：${escapeHTML(plugin.author)}
            </div>

            <div class="small">
                版本：${escapeHTML(plugin.version)}
            </div>

            <br>

            <label>中文描述</label>

            <textarea
                onchange="plugins[${index}].description=this.value"
            >${escapeHTML(plugin.description)}</textarea>

        `;

        box.appendChild(div);

    });

}


/* =========================================================
   HTML 安全
========================================================= */

function escapeHTML(str) {

    return String(str || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   GitHub API
========================================================= */

async function githubRequest(
    url,
    options = {}
) {

    const token =
        localStorage.getItem(
            "ilan_github_token"
        );

    if (!token) {

        throw new Error(
            "没有找到 GitHub Token，请先保存 Token"
        );

    }

    const headers = {

        "Authorization":
            "Bearer " + token,

        "Accept":
            "application/vnd.github+json",

        "X-GitHub-Api-Version":
            "2022-11-28"

    };

    if (options.body) {

        headers["Content-Type"] =
            "application/json";

    }

    const response =
        await fetch(
            url,
            {
                ...options,
                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            }
        );

    if (!response.ok) {

        const text =
            await response.text();

        throw new Error(
            `GitHub API ${response.status}\n${text}`
        );

    }

    return response.json();

}


/* =========================================================
   Base64
========================================================= */

function arrayBufferToBase64(buffer) {

    const bytes =
        new Uint8Array(buffer);

    let binary = "";

    const chunk = 0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += chunk
    ) {

        binary += String.fromCharCode(
            ...bytes.subarray(
                i,
                Math.min(
                    i + chunk,
                    bytes.length
                )
            )
        );

    }

    return btoa(binary);

}


/* =========================================================
   GitHub 上传文件
========================================================= */

async function uploadFile(
    path,
    file,
    message
) {

    const user =
        document.getElementById(
            "githubUser"
        ).value.trim();

    const repo =
        document.getElementById(
            "githubRepo"
        ).value.trim();

    const branch =
        document.getElementById(
            "githubBranch"
        ).value.trim() || "main";

    if (!user || !repo) {

        throw new Error(
            "请填写 GitHub 用户名和仓库名"
        );

    }

    const buffer =
        await file.arrayBuffer();

    const content =
        arrayBufferToBase64(buffer);

    const url =
        `https://api.github.com/repos/` +
        `${user}/${repo}/contents/${path}`;

    /*
       先检查文件是否已经存在
    */

    let sha = undefined;

    try {

        const old =
            await githubRequest(
                `${url}?ref=${branch}`
            );

        sha = old.sha;

    } catch(e) {

        // 文件不存在，继续创建

    }

    const body = {

        message,

        content,

        branch

    };

    if (sha) {

        body.sha = sha;

    }

    return githubRequest(
        url,
        {
            method: "PUT",
            body: JSON.stringify(body)
        }
    );

}


/* =========================================================
   上传 JSON
========================================================= */

async function uploadJSON(
    path,
    data,
    message
) {

    const user =
        document.getElementById(
            "githubUser"
        ).value.trim();

    const repo =
        document.getElementById(
            "githubRepo"
        ).value.trim();

    const branch =
        document.getElementById(
            "githubBranch"
        ).value.trim() || "main";

    const url =
        `https://api.github.com/repos/` +
        `${user}/${repo}/contents/${path}`;

    const text =
        JSON.stringify(
            data,
            null,
            2
        );

    const encoded =
        btoa(
            unescape(
                encodeURIComponent(text)
            )
        );

    let sha;

    try {

        const old =
            await githubRequest(
                `${url}?ref=${branch}`
            );

        sha = old.sha;

    } catch(e) {}

    const body = {

        message,

        content: encoded,

        branch

    };

    if (sha)
        body.sha = sha;

    return githubRequest(
        url,
        {
            method: "PUT",
            body: JSON.stringify(body)
        }
    );

}


/* =========================================================
   批量上传
========================================================= */

async function uploadAll() {

    if (!plugins.length) {

        alert("请先读取插件");

        return;
    }

    const button =
        document.getElementById(
            "uploadButton"
        );

    button.disabled = true;

    log(
        "\n========== 开始上传 =========="
    );

    const packageList = [];

    try {

        for (
            let i = 0;
            i < plugins.length;
            i++
        ) {

            const plugin =
                plugins[i];

            log(
                `\n[${i+1}/${plugins.length}] ` +
                `${plugin.name}`
            );

            /*
               上传 DEB
            */

            const debPath =
                `debs/${plugin.deb.name}`;

            log(
                "上传 DEB..."
            );

            await uploadFile(
                debPath,
                plugin.deb,
                `Add ${plugin.name}`
            );

            /*
               上传图片
            */

            let iconPath = "";

            if (plugin.image) {

                iconPath =
                    `icons/${plugin.image.name}`;

                log(
                    "上传插件图标..."
                );

                await uploadFile(
                    iconPath,
                    plugin.image,
                    `Add icon ${plugin.name}`
                );

            }

            /*
               添加到 packages
            */

            packageList.push({

                package:
                    plugin.package,

                name:
                    plugin.name,

                version:
                    plugin.version,

                author:
                    plugin.author,

                description:
                    plugin.description,

                filename:
                    debPath,

                icon:
                    iconPath

            });

            log(
                `✅ ${plugin.name} 上传完成`
            );

        }


        /*
           生成 packages.json
        */

        log(
            "\n正在生成 packages.json..."
        );

        const packageData = {

            source: {

                name: "ilan",

                description:
                    "ilan RootHide 插件源",

                website:
                    "https://ilan621.github.io/Repo/"

            },

            packages:
                packageList

        };


        await uploadJSON(
            "packages.json",
            packageData,
            "Update packages.json"
        );


        log(
            "\n🎉 全部上传完成！"
        );

        log(
            `共 ${plugins.length} 个插件`
        );

        log(
            "\n插件源地址："
        );

        const user =
            document.getElementById(
                "githubUser"
            ).value.trim();

        const repo =
            document.getElementById(
                "githubRepo"
            ).value.trim();

        log(
            `https://${user}.github.io/${repo}/`
        );

        alert(
            "🎉 全部插件上传完成！"
        );

    } catch(error) {

        console.error(error);

        log(
            "\n❌ 上传失败：\n" +
            error.message
        );

        alert(
            "上传失败，请查看下面的操作日志"
        );

    }

    button.disabled = false;

}

</script>

</body>
</html>
