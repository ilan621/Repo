<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#111827">
<title>ilan RootHide 插件源管理器</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system,BlinkMacSystemFont,"SF Pro Display",
                 "PingFang SC","Helvetica Neue",Arial,sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.header {
    background: linear-gradient(135deg,#111827,#374151);
    color: white;
    padding: 28px 18px 24px;
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.header p {
    margin: 7px 0 0;
    opacity: .75;
    font-size: 14px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 16px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.card h2 {
    margin: 0 0 15px;
    font-size: 18px;
}

label {
    display: block;
    margin: 13px 0 6px;
    font-size: 13px;
    font-weight: 600;
    color: #4b5563;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    background: #fff;
    outline: none;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

input:focus,
textarea:focus {
    border-color: #111827;
}

.upload {
    border: 2px dashed #cbd5e1;
    border-radius: 16px;
    padding: 28px 15px;
    text-align: center;
    background: #f8fafc;
}

.upload strong {
    display: block;
    font-size: 17px;
    margin-bottom: 7px;
}

.upload span {
    font-size: 13px;
    color: #64748b;
}

input[type=file] {
    margin-top: 15px;
}

.btn {
    border: 0;
    border-radius: 12px;
    padding: 13px 17px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
}

.btn-primary {
    background: #111827;
    color: white;
    width: 100%;
}

.btn-secondary {
    background: #e5e7eb;
    color: #111827;
}

.btn-danger {
    background: #fee2e2;
    color: #991b1b;
}

.plugin {
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    padding: 14px;
    margin-top: 12px;
    background: #fafafa;
}

.plugin-title {
    font-weight: 700;
    font-size: 16px;
}

.plugin-info {
    font-size: 13px;
    color: #6b7280;
    margin-top: 5px;
    line-height: 1.6;
}

.plugin img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 13px;
    float: left;
    margin-right: 12px;
}

.clear {
    clear: both;
}

.status {
    display: none;
    padding: 13px;
    border-radius: 12px;
    margin-top: 12px;
    font-size: 14px;
}

.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.warning {
    display: block;
    background: #fef3c7;
    color: #92400e;
}

.footer {
    text-align: center;
    padding: 30px 10px;
    color: #9ca3af;
    font-size: 12px;
}
</style>
</head>

<body>

<header class="header">
    <h1>ilan RootHide 源管理器</h1>
    <p>手机端插件批量管理 · 插件信息编辑 · 源文件生成</p>
</header>

<main class="container">

    <!-- 上传插件 -->
    <section class="card">
        <h2>📦 批量添加插件</h2>

        <div class="upload">
            <strong>选择 .deb 插件</strong>
            <span>可以一次选择多个插件</span>
            <input
                id="debFiles"
                type="file"
                accept=".deb"
                multiple
            >
        </div>

        <div id="pluginList"></div>
    </section>

    <!-- 默认信息 -->
    <section class="card">
        <h2>⚙️ 源信息</h2>

        <label>源名称</label>
        <input id="repoName" value="ilan RootHide 源">

        <label>源地址</label>
        <input id="repoUrl" value="https://ilan621.github.io/Repo/">

        <label>作者</label>
        <input id="repoAuthor" value="ilan">

        <label>源描述</label>
        <textarea id="repoDescription">ilan RootHide 插件源</textarea>
    </section>

    <!-- 操作 -->
    <section class="card">
        <h2>🚀 操作</h2>

        <button class="btn btn-primary" onclick="generateSource()">
            生成插件源文件
        </button>

        <button class="btn btn-secondary" onclick="downloadInfo()">
            导出插件信息 JSON
        </button>

        <button class="btn btn-danger" onclick="clearAll()">
            清空全部
        </button>

        <div id="status" class="status"></div>
    </section>

    <!-- 预览 -->
    <section class="card">
        <h2>👀 插件预览</h2>
        <div id="preview">
            <p style="color:#9ca3af">
                还没有添加插件
            </p>
        </div>
    </section>

</main>

<footer class="footer">
    ilan RootHide Repository Manager
</footer>

<script>

let plugins = [];

/* 选择 DEB */
document.getElementById("debFiles").addEventListener("change", function(e) {

    const files = Array.from(e.target.files);

    files.forEach(file => {

        const name = file.name
            .replace(/\.deb$/i,"")
            .replace(/[_-]/g," ");

        plugins.push({
            file: file,
            fileName: file.name,
            name: name,
            package: name.toLowerCase()
                .replace(/[^a-z0-9]+/g,"."),
            version: "1.0.0",
            author: "ilan",
            description: name,
            architecture: "iphoneos-arm64",
            section: "Tweaks",
            icon: ""
        });

    });

    renderPlugins();
    renderPreview();

    e.target.value = "";
});


/* 显示插件编辑器 */
function renderPlugins() {

    const box = document.getElementById("pluginList");

    box.innerHTML = "";

    plugins.forEach((p,index) => {

        const div = document.createElement("div");

        div.className = "plugin";

        div.innerHTML = `
            <div class="plugin-title">
                ${escapeHtml(p.fileName)}
            </div>

            <label>插件名称</label>
            <input
                value="${escapeHtml(p.name)}"
                onchange="updatePlugin(${index},'name',this.value)"
            >

            <label>Package ID</label>
            <input
                value="${escapeHtml(p.package)}"
                onchange="updatePlugin(${index},'package',this.value)"
            >

            <label>版本</label>
            <input
                value="${escapeHtml(p.version)}"
                onchange="updatePlugin(${index},'version',this.value)"
            >

            <label>作者</label>
            <input
                value="${escapeHtml(p.author)}"
                onchange="updatePlugin(${index},'author',this.value)"
            >

            <label>中文描述</label>
            <textarea
                onchange="updatePlugin(${index},'description',this.value)"
            >${escapeHtml(p.description)}</textarea>

            <label>图标 PNG</label>
            <input
                type="file"
                accept="image/png,image/jpeg"
                onchange="loadIcon(${index},this)"
            >

            <button
                class="btn btn-danger"
                onclick="removePlugin(${index})"
            >
                删除插件
            </button>

            <div class="clear"></div>
        `;

        box.appendChild(div);
    });
}


/* 修改插件 */
function updatePlugin(index,key,value) {

    plugins[index][key] = value;

    renderPreview();
}


/* 加载图标 */
function loadIcon(index,input) {

    const file = input.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        plugins[index].icon = e.target.result;

        renderPreview();
    };

    reader.readAsDataURL(file);
}


/* 删除 */
function removePlugin(index) {

    plugins.splice(index,1);

    renderPlugins();
    renderPreview();
}


/* 预览 */
function renderPreview() {

    const box = document.getElementById("preview");

    if (!plugins.length) {

        box.innerHTML =
            `<p style="color:#9ca3af">还没有添加插件</p>`;

        return;
    }

    box.innerHTML = "";

    plugins.forEach(p => {

        const div = document.createElement("div");

        div.className = "plugin";

        let icon = "";

        if (p.icon) {

            icon = `
                <img src="${p.icon}">
            `;
        }

        div.innerHTML = `
            ${icon}

            <div class="plugin-title">
                ${escapeHtml(p.name)}
            </div>

            <div class="plugin-info">
                ${escapeHtml(p.description)}<br>
                版本：${escapeHtml(p.version)}<br>
                作者：${escapeHtml(p.author)}<br>
                ID：${escapeHtml(p.package)}
            </div>

            <div class="clear"></div>
        `;

        box.appendChild(div);
    });
}


/* 生成插件源信息 */
function generateSource() {

    if (!plugins.length) {

        showStatus(
            "请先选择至少一个 .deb 插件",
            "warning"
        );

        return;
    }

    const data = {

        repository: {

            name: document.getElementById("repoName").value,

            url: document.getElementById("repoUrl").value,

            author: document.getElementById("repoAuthor").value,

            description:
                document.getElementById("repoDescription").value
        },

        plugins: plugins.map(p => ({

            name: p.name,

            package: p.package,

            version: p.version,

            author: p.author,

            description: p.description,

            architecture: p.architecture,

            section: p.section,

            file: p.fileName,

            icon: p.icon ? true : false

        }))
    };

    downloadFile(
        "plugins.json",
        JSON.stringify(data,null,2),
        "application/json"
    );

    showStatus(
        "插件信息已经生成。下一步接入 GitHub Actions 后，就可以自动上传并生成 Packages。",
        "success"
    );
}


/* 导出 JSON */
function downloadInfo() {

    if (!plugins.length) {

        showStatus(
            "当前没有插件信息",
            "warning"
        );

        return;
    }

    const data = plugins.map(p => ({

        name: p.name,

        package: p.package,

        version: p.version,

        author: p.author,

        description: p.description,

        file: p.fileName

    }));

    downloadFile(
        "plugins.json",
        JSON.stringify(data,null,2),
        "application/json"
    );
}


/* 下载文件 */
function downloadFile(name,data,type) {

    const blob = new Blob(
        [data],
        {type:type}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;

    a.download = name;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
}


/* 清空 */
function clearAll() {

    if (!confirm("确定要清空全部插件吗？")) {
        return;
    }

    plugins = [];

    renderPlugins();

    renderPreview();

    showStatus(
        "已经清空",
        "success"
    );
}


/* 提示 */
function showStatus(text,type) {

    const box = document.getElementById("status");

    box.className =
        "status " + type;

    box.textContent = text;
}


/* 防止 HTML 注入 */
function escapeHtml(text) {

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* 初始化 */
renderPlugins();
renderPreview();

</script>

</body>
</html>
