<script>

let selectedFiles=[];
let plugins=[];


/* =====================================================
   初始化
===================================================== */

window.addEventListener("load",()=>{
    loadSettings();
});


/* =====================================================
   日志
===================================================== */

function log(text){

    const box=document.getElementById("status");

    box.innerText+="\n"+text;

    box.scrollTop=box.scrollHeight;
}


/* =====================================================
   设置
===================================================== */

function loadSettings(){

    const token=localStorage.getItem("ilan_token");
    const user=localStorage.getItem("ilan_user");
    const repo=localStorage.getItem("ilan_repo");
    const branch=localStorage.getItem("ilan_branch");

    if(token){
        document.getElementById("token").value=token;
        document.getElementById("tokenStatus").innerText=
            "✅ Token 已保存，本机下次无需重新输入";
    }

    if(user)
        document.getElementById("githubUser").value=user;

    if(repo)
        document.getElementById("githubRepo").value=repo;

    if(branch)
        document.getElementById("githubBranch").value=branch;
}


function saveSettings(){

    const token=document.getElementById("token").value.trim();
    const user=document.getElementById("githubUser").value.trim();
    const repo=document.getElementById("githubRepo").value.trim();
    const branch=document.getElementById("githubBranch").value.trim()||"main";

    if(!token){
        alert("请输入 GitHub Token");
        return;
    }

    if(!user||!repo){
        alert("请填写 GitHub 用户名和仓库名称");
        return;
    }

    localStorage.setItem("ilan_token",token);
    localStorage.setItem("ilan_user",user);
    localStorage.setItem("ilan_repo",repo);
    localStorage.setItem("ilan_branch",branch);

    document.getElementById("tokenStatus").innerText=
        "✅ 设置已保存";

    log("GitHub 设置保存成功");
}


function clearToken(){

    localStorage.removeItem("ilan_token");

    document.getElementById("token").value="";

    document.getElementById("tokenStatus").innerText=
        "Token 已清除";

    log("已清除本机 Token");
}


/* =====================================================
   文件选择
===================================================== */

document.getElementById("files").addEventListener("change",function(e){

    selectedFiles=Array.from(e.target.files);

    const debs=selectedFiles.filter(
        f=>/\.deb$/i.test(f.name)
    );

    const images=selectedFiles.filter(
        f=>/\.(png|jpg|jpeg)$/i.test(f.name)
    );

    document.getElementById("fileInfo").innerText=
        `总文件：${selectedFiles.length}\n`+
        `DEB：${debs.length}\n`+
        `图片：${images.length}`;
});


/* =====================================================
   DEB AR 解析
===================================================== */

function parseAR(buffer){

    const bytes=new Uint8Array(buffer);

    const magic=new TextDecoder("ascii")
        .decode(bytes.slice(0,8));

    if(magic!=="!<arch>\n"){
        throw new Error("不是有效的 DEB 文件");
    }

    let offset=8;
    const files=[];

    while(offset+60<=bytes.length){

        const header=bytes.slice(offset,offset+60);

        const name=new TextDecoder("ascii")
            .decode(header.slice(0,16))
            .trim();

        const sizeText=new TextDecoder("ascii")
            .decode(header.slice(48,58))
            .trim();

        const size=parseInt(sizeText,10);

        if(!Number.isFinite(size)||size<0)
            break;

        const start=offset+60;
        const end=start+size;

        if(end>bytes.length)
            break;

        files.push({
            name,
            data:bytes.slice(start,end)
        });

        offset=end;

        if(offset%2!==0)
            offset++;
    }

    return files;
}


/* =====================================================
   gzip
===================================================== */

async function gzipDecode(bytes){

    if(typeof DecompressionStream==="undefined"){
        throw new Error("当前浏览器不支持 gzip 解压");
    }

    const stream=new Blob([bytes])
        .stream()
        .pipeThrough(
            new DecompressionStream("gzip")
        );

    return new Uint8Array(
        await new Response(stream).arrayBuffer()
    );
}


/* =====================================================
   TAR
===================================================== */

function parseTar(bytes){

    const files=[];
    let offset=0;

    while(offset+512<=bytes.length){

        const header=bytes.slice(
            offset,
            offset+512
        );

        let empty=true;

        for(let i=0;i<512;i++){

            if(header[i]!==0){
                empty=false;
                break;
            }
        }

        if(empty)
            break;

        const name=new TextDecoder("utf-8")
            .decode(header.slice(0,100))
            .replace(/\0/g,"")
            .trim();

        const sizeText=new TextDecoder("ascii")
            .decode(header.slice(124,136))
            .replace(/\0/g,"")
            .trim();

        const size=parseInt(sizeText,8)||0;

        const type=header[156];

        const start=offset+512;
        const end=start+size;

        if(end>bytes.length)
            break;

        if(type===0||type===48){

            files.push({
                name,
                data:bytes.slice(start,end)
            });
        }

        offset=
            start+
            Math.ceil(size/512)*512;
    }

    return files;
}


/* =====================================================
   读取 DEB control
===================================================== */

async function extractControl(debFile){

    const buffer=await debFile.arrayBuffer();

    const ar=parseAR(buffer);

    const control=ar.find(
        x=>/^control\.tar/i.test(x.name)
    );

    if(!control){
        throw new Error(
            "DEB 中没有找到 control.tar.*"
        );
    }

    let tarBytes=control.data;

    const name=control.name.toLowerCase();

    if(name.includes(".gz")){
        tarBytes=await gzipDecode(tarBytes);
    }

    if(name.includes(".xz")){
        throw new Error(
            "检测到 control.tar.xz，当前浏览器解析器未启用 XZ"
        );
    }

    if(name.includes(".zst")){
        throw new Error(
            "检测到 control.tar.zst，当前浏览器解析器未启用 Zstandard"
        );
    }

    const files=parseTar(tarBytes);

    const controlFile=files.find(
        x=>
            x.name==="control"||
            x.name==="./control"||
            x.name.endsWith("/control")
    );

    if(!controlFile){
        throw new Error(
            "control.tar 中没有找到 control 文件"
        );
    }

    return new TextDecoder("utf-8")
        .decode(controlFile.data);
}


/* =====================================================
   Debian control
===================================================== */

function parseControl(text){

    const result={};

    const lines=text
        .replace(/\r/g,"")
        .split("\n");

    let current=null;

    for(const line of lines){

        if(!line.trim())
            continue;

        if(/^[ \t]/.test(line)&&current){

            result[current]+=
                "\n"+line.trim();

            continue;
        }

        const index=line.indexOf(":");

        if(index===-1)
            continue;

        const key=line.slice(0,index).trim();

        const value=line.slice(index+1).trim();

        current=key;

        result[key]=value;
    }

    return result;
}


/* =====================================================
   描述清理
===================================================== */

function cleanDescription(text){

    return text
        .replace(/\n[ \t]*\.[ \t]*/g,"\n")
        .replace(/\n[ \t]+/g,"\n")
        .trim();
}


/* =====================================================
   解析 DEB
===================================================== */

async function analyzeDeb(file){

    const text=await extractControl(file);

    const control=parseControl(text);

    return{

        package:
            control.Package||"",

        name:
            control.Name||
            control.Package||
            "",

        version:
            control.Version||"",

        author:
            control.Author||
            control.Maintainer||
            "",

        description:
            cleanDescription(
                control.Description||""
            ),

        architecture:
            control.Architecture||
            ""

    };
}


/* =====================================================
   查找图标
===================================================== */

function findImage(deb){

    const base=deb.name
        .replace(/\.deb$/i,"")
        .toLowerCase();

    return selectedFiles.find(
        file=>{

            const name=file.name
                .replace(
                    /\.(png|jpg|jpeg)$/i,
                    ""
                )
                .toLowerCase();

            return name===base;
        }
    );
}


/* =====================================================
   分析插件
===================================================== */

async function analyzeFiles(){

    const debs=selectedFiles.filter(
        f=>/\.deb$/i.test(f.name)
    );

    if(!debs.length){

        alert("请选择 DEB 文件");

        return;
    }

    plugins=[];

    document.getElementById("plugins").innerHTML=
        "正在读取插件信息...";

    log(`开始解析 ${debs.length} 个 DEB`);

    for(const deb of debs){

        try{

            log(`\n读取：${deb.name}`);

            const info=await analyzeDeb(deb);

            const image=findImage(deb);

            plugins.push({

                deb,
                image,

                original:{
                    package:info.package,
                    name:info.name,
                    version:info.version,
                    author:info.author,
                    description:info.description,
                    architecture:info.architecture
                },

                package:info.package,
                name:info.name,
                version:info.version,
                author:info.author,
                description:info.description,
                architecture:info.architecture
            });

            log(
                `✅ ${info.name} ${info.version}`
            );

        }catch(error){

            log(
                `❌ ${deb.name}\n${error.message}`
            );
        }
    }

    renderPlugins();

    document.getElementById("uploadButton").disabled=
        plugins.length===0;

    log(
        `\n解析完成：${plugins.length} 个插件`
    );
}


/* =====================================================
   HTML 安全
===================================================== */

function escapeHTML(value){

    return String(value||"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   插件编辑界面
===================================================== */

function renderPlugins(){

    const box=document.getElementById("plugins");

    box.innerHTML="";

    plugins.forEach((plugin,index)=>{

        const div=document.createElement("div");

        div.className="plugin";

        let iconHTML=
            `<div class="icon"></div>`;

        if(plugin.image){

            const url=
                URL.createObjectURL(
                    plugin.image
                );

            iconHTML=
                `<img
                    id="icon-${index}"
                    class="icon"
                    src="${url}"
                >`;
        }

        div.innerHTML=`

            <div class="pluginTop">

                ${iconHTML}

                <div>

                    <div class="pluginTitle">
                        ${escapeHTML(plugin.name)}
                    </div>

                    <div class="small">
                        ${escapeHTML(plugin.package)}
                    </div>

                    <div class="badge">
                        已自动读取 DEB
                    </div>

                </div>

            </div>


            <div class="field">

                <label>
                    插件名称
                </label>

                <input
                    id="name-${index}"
                    value="${escapeHTML(plugin.name)}"
                >

                <div class="auto">
                    可自定义修改
                </div>

            </div>


            <div class="field">

                <label>
                    Package ID
                </label>

                <input
                    id="package-${index}"
                    value="${escapeHTML(plugin.package)}"
                >

            </div>


            <div class="field">

                <label>
                    版本
                </label>

                <input
                    id="version-${index}"
                    value="${escapeHTML(plugin.version)}"
                >

            </div>


            <div class="field">

                <label>
                    作者 / Maintainer
                </label>

                <input
                    id="author-${index}"
                    value="${escapeHTML(plugin.author)}"
                >

            </div>


            <div class="field">

                <label>
                    架构
                </label>

                <input
                    id="arch-${index}"
                    value="${escapeHTML(plugin.architecture)}"
                >

            </div>


            <div class="field">

                <label>
                    📝 插件描述
                </label>

                <textarea
                    id="description-${index}"
                >${escapeHTML(plugin.description)}</textarea>

                <div class="auto">
                    这里可以直接修改成中文介绍
                </div>

            </div>


            <div class="field">

                <label>
                    🖼️ 更换插件图标
                </label>

                <input
                    type="file"
                    accept=".png,.jpg,.jpeg"
                    onchange="changeIcon(${index},this)"
                >

            </div>


            <button
                class="secondary"
                onclick="restorePlugin(${index})">

                ↩️ 恢复 DEB 原始信息

            </button>

        `;

        box.appendChild(div);

    });
}


/* =====================================================
   修改图标
===================================================== */

function changeIcon(index,input){

    const file=input.files[0];

    if(!file)
        return;

    plugins[index].image=file;

    const oldIcon=
        document.getElementById(
            `icon-${index}`
        );

    const url=
        URL.createObjectURL(file);

    if(oldIcon){

        oldIcon.src=url;

    }else{

        renderPlugins();

    }

    log(
        `🖼️ 已更换 ${plugins[index].name} 图标`
    );
}


/* =====================================================
   恢复原始信息
===================================================== */

function restorePlugin(index){

    const original=
        plugins[index].original;

    plugins[index].package=
        original.package;

    plugins[index].name=
        original.name;

    plugins[index].version=
        original.version;

    plugins[index].author=
        original.author;

    plugins[index].description=
        original.description;

    plugins[index].architecture=
        original.architecture;

    renderPlugins();

    log(
        `↩️ 已恢复 ${original.name} 原始信息`
    );
}


/* =====================================================
   读取编辑后的数据
===================================================== */

function collectEditedData(){

    plugins.forEach((plugin,index)=>{

        plugin.name=
            document.getElementById(
                `name-${index}`
            ).value.trim();

        plugin.package=
            document.getElementById(
                `package-${index}`
            ).value.trim();

        plugin.version=
            document.getElementById(
                `version-${index}`
            ).value.trim();

        plugin.author=
            document.getElementById(
                `author-${index}`
            ).value.trim();

        plugin.architecture=
            document.getElementById(
                `arch-${index}`
            ).value.trim();

        plugin.description=
            document.getElementById(
                `description-${index}`
            ).value.trim();
    });
}


/* =====================================================
   GitHub API
===================================================== */

async function githubRequest(url,options={}){

    const token=
        localStorage.getItem(
            "ilan_token"
        );

    if(!token)
        throw new Error(
            "没有找到 GitHub Token"
        );

    const headers={

        "Authorization":
            `Bearer ${token}`,

        "Accept":
            "application/vnd.github+json",

        "X-GitHub-Api-Version":
            "2022-11-28"
    };

    if(options.body){

        headers["Content-Type"]=
            "application/json";
    }

    const response=
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );

    if(!response.ok){

        const text=
            await response.text();

        throw new Error(
            `GitHub ${response.status}\n${text}`
        );
    }

    return response.json();
}


/* =====================================================
   Base64
===================================================== */

function arrayBufferToBase64(buffer){

    const bytes=
        new Uint8Array(buffer);

    let binary="";

    const chunk=0x8000;

    for(
        let i=0;
        i<bytes.length;
        i+=chunk
    ){

        binary+=String.fromCharCode(
            ...bytes.slice(
                i,
                i+chunk
            )
        );
    }

    return btoa(binary);
}


/* =====================================================
   上传文件
===================================================== */

async function uploadFile(
    path,
    file,
    message
){

    const user=
        document.getElementById(
            "githubUser"
        ).value.trim();

    const repo=
        document.getElementById(
            "githubRepo"
        ).value.trim();

    const branch=
        document.getElementById(
            "githubBranch"
        ).value.trim()||"main";

    const url=
        `https://api.github.com/repos/`+
        `${user}/${repo}/contents/${path}`;

    const content=
        arrayBufferToBase64(
            await file.arrayBuffer()
        );

    let sha;

    try{

        const old=
            await githubRequest(
                `${url}?ref=${branch}`
            );

        sha=old.sha;

    }catch(e){}

    const body={
        message,
        content,
        branch
    };

    if(sha)
        body.sha=sha;

    return githubRequest(
        url,
        {
            method:"PUT",
            body:JSON.stringify(body)
        }
    );
}


/* =====================================================
   上传 JSON
===================================================== */

async function uploadJSON(
    path,
    data,
    message
){

    const user=
        document.getElementById(
            "githubUser"
        ).value.trim();

    const repo=
        document.getElementById(
            "githubRepo"
        ).value.trim();

    const branch=
        document.getElementById(
            "githubBranch"
        ).value.trim()||"main";

    const url=
        `https://api.github.com/repos/`+
        `${user}/${repo}/contents/${path}`;

    const bytes=
        new TextEncoder().encode(
            JSON.stringify(
                data,
                null,
                2
            )
        );

    const content=
        arrayBufferToBase64(bytes);

    let sha;

    try{

        const old=
            await githubRequest(
                `${url}?ref=${branch}`
            );

        sha=old.sha;

    }catch(e){}

    const body={
        message,
        content,
        branch
    };

    if(sha)
        body.sha=sha;

    return githubRequest(
        url,
        {
            method:"PUT",
            body:JSON.stringify(body)
        }
    );
}


/* =====================================================
   批量上传
===================================================== */

async function uploadAll(){

    if(!plugins.length){

        alert("没有插件");

        return;
    }

    /*
       先获取用户编辑后的信息
    */

    collectEditedData();


    /*
       检查
    */

    for(const plugin of plugins){

        if(!plugin.package){

            alert(
                "有插件没有 Package ID"
            );

            return;
        }

        if(!plugin.name){

            alert(
                "有插件没有插件名称"
            );

            return;
        }

        if(!plugin.version){

            alert(
                `插件 ${plugin.name} 没有版本号`
            );

            return;
        }
    }


    const button=
        document.getElementById(
            "uploadButton"
        );

    button.disabled=true;

    log(
        "\n========== 开始上传 =========="
    );


    const packages=[];


    try{

        for(
            let i=0;
            i<plugins.length;
            i++
        ){

            const plugin=
                plugins[i];


            log(
                `\n[${i+1}/${plugins.length}] `+
                `${plugin.name}`
            );


            /*
               上传 DEB
            */

            const debPath=
                `debs/${plugin.deb.name}`;


            log(
                "上传 DEB..."
            );


            await uploadFile(
                debPath,
                plugin.deb,
                `Add ${plugin.name}`
            );


            /*
               上传图标
            */

            let iconPath="";


            if(plugin.image){

                iconPath=
                    `icons/${plugin.image.name}`;


                log(
                    "上传图标..."
                );


                await uploadFile(
                    iconPath,
                    plugin.image,
                    `Update icon ${plugin.name}`
                );
            }


            /*
               生成源数据
            */

            packages.push({

                package:
                    plugin.package,

                name:
                    plugin.name,

                version:
                    plugin.version,

                author:
                    plugin.author,

                description:
                    plugin.description,

                architecture:
                    plugin.architecture,

                filename:
                    debPath,

                icon:
                    iconPath
            });


            log(
                `✅ ${plugin.name} 完成`
            );
        }


        /*
           packages.json
        */

        log(
            "\n正在生成 packages.json..."
        );


        const data={

            source:{

                name:"ilan",

                description:
                    "ilan RootHide 插件源",

                website:
                    "https://ilan621.github.io/Repo/"

            },

            packages

        };


        await uploadJSON(
            "packages.json",
            data,
            "Update packages.json"
        );


        log(
            "\n🎉 全部上传成功！"
        );


        log(
            `共上传 ${packages.length} 个插件`
        );


        alert(
            "🎉 插件源更新成功！"
        );


    }catch(error){

        console.error(error);

        log(
            "\n❌ 上传失败：\n"+
            error.message
        );

        alert(
            "上传失败，请查看操作日志"
        );

    }


    button.disabled=false;
}

</script>

</body>
</html>
