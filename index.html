<script>

/* =====================================================
   全局变量
===================================================== */

let selectedFiles = [];

let plugins = [];


/* =====================================================
   启动
===================================================== */

window.addEventListener(
    "load",
    loadSettings
);


/* =====================================================
   日志
===================================================== */

function log(text) {

    const box =
        document.getElementById("status");

    box.innerText +=
        "\n" + text;

    box.scrollTop =
        box.scrollHeight;
}


/* =====================================================
   设置
===================================================== */

function loadSettings() {

    const token =
        localStorage.getItem(
            "ilan_token"
        );

    const user =
        localStorage.getItem(
            "ilan_user"
        );

    const repo =
        localStorage.getItem(
            "ilan_repo"
        );

    const branch =
        localStorage.getItem(
            "ilan_branch"
        );


    if (token) {

        document.getElementById(
            "token"
        ).value = token;

        document.getElementById(
            "tokenStatus"
        ).innerText =
            "✅ Token 已保存，本机下次无需重新输入";

    }


    if (user)
        document.getElementById(
            "githubUser"
        ).value = user;


    if (repo)
        document.getElementById(
            "githubRepo"
        ).value = repo;


    if (branch)
        document.getElementById(
            "githubBranch"
        ).value = branch;

}


function saveSettings() {

    const token =
        document.getElementById(
            "token"
        ).value.trim();

    const user =
        document.getElementById(
            "githubUser"
        ).value.trim();

    const repo =
        document.getElementById(
            "githubRepo"
        ).value.trim();

    const branch =
        document.getElementById(
            "githubBranch"
        ).value.trim() || "main";


    if (!token) {

        alert(
            "请输入 GitHub Token"
        );

        return;
    }


    if (!user || !repo) {

        alert(
            "请填写 GitHub 用户名和仓库名称"
        );

        return;
    }


    localStorage.setItem(
        "ilan_token",
        token
    );

    localStorage.setItem(
        "ilan_user",
        user
    );

    localStorage.setItem(
        "ilan_repo",
        repo
    );

    localStorage.setItem(
        "ilan_branch",
        branch
    );


    document.getElementById(
        "tokenStatus"
    ).innerText =
        "✅ 设置已保存";

    log(
        "GitHub 设置保存成功"
    );

}


/* =====================================================
   清除 Token
===================================================== */

function clearToken() {

    localStorage.removeItem(
        "ilan_token"
    );

    document.getElementById(
        "token"
    ).value = "";

    document.getElementById(
        "tokenStatus"
    ).innerText =
        "Token 已清除";

    log(
        "已清除本机 Token"
    );

}


/* =====================================================
   文件选择
===================================================== */

document
.getElementById("files")
.addEventListener(
    "change",
    function(event) {

        selectedFiles =
            Array.from(
                event.target.files
            );


        const debs =
            selectedFiles.filter(
                file =>
                    /\.deb$/i.test(
                        file.name
                    )
            );


        const images =
            selectedFiles.filter(
                file =>
                    /\.(png|jpg|jpeg)$/i.test(
                        file.name
                    )
            );


        document.getElementById(
            "fileInfo"
        ).innerText =

            `总文件：${selectedFiles.length}\n` +

            `DEB：${debs.length}\n` +

            `图片：${images.length}`;

    }
);


/* =====================================================
   ArrayBuffer → Uint8Array
===================================================== */

function readBytes(
    buffer,
    start,
    end
) {

    return new Uint8Array(
        buffer.slice(
            start,
            end
        )
    );

}


/* =====================================================
   读取 AR archive
===================================================== */

function parseAR(buffer) {

    const bytes =
        new Uint8Array(buffer);

    const magic =
        new TextDecoder(
            "ascii"
        ).decode(
            bytes.slice(0,8)
        );


    if (magic !== "!<arch>\n") {

        throw new Error(
            "不是有效的 DEB 文件"
        );

    }


    let offset = 8;

    const files = [];


    while (
        offset + 60 <=
        bytes.length
    ) {

        const header =
            bytes.slice(
                offset,
                offset + 60
            );


        const name =
            new TextDecoder(
                "ascii"
            )
            .decode(
                header.slice(0,16)
            )
            .trim();


        const sizeText =
            new TextDecoder(
                "ascii"
            )
            .decode(
                header.slice(48,58)
            )
            .trim();


        const size =
            parseInt(
                sizeText,
                10
            );


        if (
            !Number.isFinite(size) ||
            size < 0
        ) {

            break;

        }


        const dataStart =
            offset + 60;

        const dataEnd =
            dataStart + size;


        if (
            dataEnd >
            bytes.length
        ) {

            break;

        }


        files.push({

            name,

            data:
                bytes.slice(
                    dataStart,
                    dataEnd
                )

        });


        offset =
            dataEnd;

        if (
            offset % 2 !== 0
        ) {

            offset++;

        }

    }


    return files;

}


/* =====================================================
   找 control archive
===================================================== */

function findControlArchive(
    files
) {

    return files.find(
        file =>
            /^control\.tar/i.test(
                file.name
            )
    );

}


/* =====================================================
   TAR 解析
===================================================== */

function parseTar(
    bytes
) {

    const files = [];

    let offset = 0;


    while (
        offset + 512 <=
        bytes.length
    ) {

        const header =
            bytes.slice(
                offset,
                offset + 512
            );


        let empty = true;

        for (
            let i = 0;
            i < 512;
            i++
        ) {

            if (header[i] !== 0) {

                empty = false;

                break;

            }

        }


        if (empty)
            break;


        const name =
            decodeUTF8(
                header.slice(
                    0,
                    100
                )
            )
            .replace(/\0/g,"")
            .trim();


        const sizeText =
            decodeUTF8(
                header.slice(
                    124,
                    136
                )
            )
            .replace(/\0/g,"")
            .trim();


        const size =
            parseInt(
                sizeText,
                8
            ) || 0;


        const type =
            header[156];


        const dataStart =
            offset + 512;

        const dataEnd =
            dataStart + size;


        if (
            dataEnd >
            bytes.length
        )
            break;


        if (
            type === 0 ||
            type === 48
        ) {

            files.push({

                name,

                data:
                    bytes.slice(
                        dataStart,
                        dataEnd
                    )

            });

        }


        offset =
            dataStart +
            Math.ceil(
                size / 512
            ) * 512;

    }


    return files;

}


/* =====================================================
   UTF-8
===================================================== */

function decodeUTF8(
    bytes
) {

    return new TextDecoder(
        "utf-8",
        {
            fatal:false
        }
    ).decode(bytes);

}


/* =====================================================
   简易 gzip 解压
===================================================== */

async function decompressGzip(
    bytes
) {

    if (
        typeof DecompressionStream ===
        "undefined"
    ) {

        throw new Error(
            "当前浏览器不支持 gzip 解压"
        );

    }


    const stream =
        new Blob([
            bytes
        ])
        .stream()
        .pipeThrough(
            new DecompressionStream(
                "gzip"
            )
        );


    const buffer =
        await new Response(
            stream
        ).arrayBuffer();


    return new Uint8Array(
        buffer
    );

}


/* =====================================================
   DEB → control
===================================================== */

async function extractControl(
    debFile
) {

    const buffer =
        await debFile.arrayBuffer();


    const arFiles =
        parseAR(buffer);


    const control =
        findControlArchive(
            arFiles
        );


    if (!control) {

        throw new Error(
            "DEB 中没有找到 control.tar.*"
        );

    }


    let tarBytes =
        control.data;


    /*
       gzip
    */

    if (
        control.name
        .toLowerCase()
        .includes(".gz")
    ) {

        tarBytes =
            await decompressGzip(
                tarBytes
            );

    }


    /*
       目前浏览器原生稳定支持 gzip。
       xz / zstd 在部分 DEB 中需要额外解码器。
    */

    if (
        control.name
        .toLowerCase()
        .includes(".xz")
    ) {

        throw new Error(
            "检测到 control.tar.xz；此浏览器版需要额外 XZ 解码器"
        );

    }


    if (
        control.name
        .toLowerCase()
        .includes(".zst")
    ) {

        throw new Error(
            "检测到 control.tar.zst；此浏览器版需要额外 Zstandard 解码器"
        );

    }


    const tarFiles =
        parseTar(
            tarBytes
        );


    const controlFile =
        tarFiles.find(
            file =>
                file.name ===
                "./control" ||
                file.name ===
                "control" ||
                file.name.endsWith(
                    "/control"
                )
        );


    if (!controlFile) {

        throw new Error(
            "control.tar 中没有找到 control 文件"
        );

    }


    return decodeUTF8(
        controlFile.data
    );

}


/* =====================================================
   Debian control parser
===================================================== */

function parseControl(
    text
) {

    const result = {};

    const lines =
        text.replace(
            /\r/g,
            ""
        ).split("\n");


    let currentField = null;


    for (
        const line of lines
    ) {

        if (!line.trim())
            continue;


        /*
           continuation line
        */

        if (
            /^[ \t]/.test(line) &&
            currentField
        ) {

            result[currentField] +=
                "\n" +
                line.trim();

            continue;

        }


        const index =
            line.indexOf(":");


        if (index === -1)
            continue;


        const key =
            line
            .slice(
                0,
                index
            )
            .trim();


        const value =
            line
            .slice(
                index + 1
            )
            .trim();


        currentField =
            key;


        result[key] =
            value;

    }


    return result;

}


/* =====================================================
   分析 DEB
===================================================== */

async function analyzeDeb(
    file
) {

    const controlText =
        await extractControl(
            file
        );


    const control =
        parseControl(
            controlText
        );


    return {

        package:
            control.Package ||
            "",

        name:
            control.Name ||
            control.Package ||
            "",

        version:
            control.Version ||
            "",

        author:
            control.Author ||
            control.Maintainer ||
            "",

        description:
            cleanDescription(
                control.Description ||
                ""
            ),

        architecture:
            control.Architecture ||
            ""

    };

}


/* =====================================================
   描述清理
===================================================== */

function cleanDescription(
    text
) {

    /*
       Debian description:

       第一行是概要
       后面可能有长描述
    */

    return text
        .replace(
            /\n[ \t]*\.[ \t]*/g,
            "\n"
        )
        .replace(
            /\n[ \t]+/g,
            "\n"
        )
        .trim();

}


/* =====================================================
   查找图片
===================================================== */

function findImage(
    deb
) {

    const base =
        deb.name
        .replace(
            /\.deb$/i,
            ""
        )
        .toLowerCase();


    return selectedFiles.find(
        file => {

            const imageName =
                file.name
                .replace(
                    /\.(png|jpg|jpeg)$/i,
                    ""
                )
                .toLowerCase();


            return (
                imageName === base
            );

        }
    );

}


/* =====================================================
   分析所有文件
===================================================== */

async function analyzeFiles() {

    const debs =
        selectedFiles.filter(
            file =>
                /\.deb$/i.test(
                    file.name
                )
        );


    if (!debs.length) {

        alert(
            "请选择 DEB 文件"
        );

        return;

    }


    plugins = [];


    document.getElementById(
        "plugins"
    ).innerHTML =
        "正在读取 DEB...";


    log(
        `开始解析 ${debs.length} 个 DEB`
    );


    for (
        const deb of debs
    ) {

        try {

            log(
                `\n读取：${deb.name}`
            );


            const info =
                await analyzeDeb(
                    deb
                );


            const image =
                findImage(
                    deb
                );


            plugins.push({

                deb,

                image,

                package:
                    info.package,

                name:
                    info.name,

                version:
                    info.version,

                author:
                    info.author,

                description:
                    info.description,

                architecture:
                    info.architecture

            });


            log(
                `✅ ${info.name} ${info.version}`
            );


        } catch(error) {

            log(
                `❌ ${deb.name}\n` +
                error.message
            );

        }

    }


    renderPlugins();


    document.getElementById(
        "uploadButton"
    ).disabled =
        plugins.length === 0;


    log(
        `\n解析完成：${plugins.length} 个插件`
    );

}


/* =====================================================
   HTML escape
===================================================== */

function escapeHTML(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   显示插件
===================================================== */

function renderPlugins() {

    const box =
        document.getElementById(
            "plugins"
        );


    box.innerHTML = "";


    plugins.forEach(
        (plugin,index) => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "plugin";


            let iconHTML =
                `<div class="icon"></div>`;


            if (plugin.image) {

                const url =
                    URL.createObjectURL(
                        plugin.image
                    );


                iconHTML =
                    `<img
                        class="icon"
                        src="${url}"
                    >`;

            }


            div.innerHTML = `

                <div class="pluginHeader">

                    ${iconHTML}

                    <div>

                        <div class="pluginName">
                            ${escapeHTML(
                                plugin.name
                            )}
                        </div>

                        <div class="small">
                            ${escapeHTML(
                                plugin.package
                            )}
                        </div>

                    </div>

                </div>

                <br>

                <div class="small">
                    作者：
                    ${escapeHTML(
                        plugin.author
                    )}
                </div>

                <div class="small">
                    版本：
                    ${escapeHTML(
                        plugin.version
                    )}
                </div>

                <div class="small">
                    架构：
                    ${escapeHTML(
                        plugin.architecture
                    )}
                </div>

                <br>

                <label>
                    中文描述
                </label>

                <textarea
                    data-index="${index}"
                    class="description"
                >${escapeHTML(
                    plugin.description
                )}</textarea>

            `;


            const textarea =
                div.querySelector(
                    ".description"
                );


            textarea.addEventListener(
                "input",
                function() {

                    plugins[index]
                        .description =
                        this.value;

                }
            );


            box.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   GitHub API
===================================================== */

async function githubRequest(
    url,
    options = {}
) {

    const token =
        localStorage.getItem(
            "ilan_token"
        );


    if (!token) {

        throw new Error(
            "GitHub Token 不存在"
        );

    }


    const headers = {

        "Authorization":
            `Bearer ${token}`,

        "Accept":
            "application/vnd.github+json",

        "X-GitHub-Api-Version":
            "2022-11-28"

    };


    if (options.body) {

        headers[
            "Content-Type"
        ] =
            "application/json";

    }


    const response =
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );


    if (!response.ok) {

        const text =
            await response.text();


        throw new Error(
            `GitHub ${response.status}\n${text}`
        );

    }


    return response.json();

}


/* =====================================================
   Base64
===================================================== */

function arrayBufferToBase64(
    buffer
) {

    const bytes =
        new Uint8Array(
            buffer
        );


    let binary = "";


    const chunk =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += chunk
    ) {

        binary +=
            String.fromCharCode(
                ...bytes.slice(
                    i,
                    i + chunk
                )
            );

    }


    return btoa(
        binary
    );

}


/* =====================================================
   上传文件
===================================================== */

async function uploadFile(
    path,
    file,
    message
) {

    const user =
        document.getElementById(
            "githubUser"
        ).value.trim();


    const repo =
        document.getElementById(
            "githubRepo"
        ).value.trim();


    const branch =
        document.getElementById(
            "githubBranch"
        ).value.trim() ||
        "main";


    const url =
        `https://api.github.com/repos/` +
        `${user}/${repo}/contents/${path}`;


    const content =
        arrayBufferToBase64(
            await file.arrayBuffer()
        );


    let sha;


    try {

        const old =
            await githubRequest(
                `${url}?ref=${branch}`
            );


        sha =
            old.sha;

    } catch(e) {

        /*
           文件不存在
        */

    }


    const body = {

        message,

        content,

        branch

    };


    if (sha)
        body.sha =
            sha;


    return githubRequest(
        url,
        {
            method: "PUT",
            body:
                JSON.stringify(
                    body
                )
        }
    );

}


/* =====================================================
   上传 JSON
===================================================== */

async function uploadJSON(
    path,
    data,
    message
) {

    const user =
        document.getElementById(
            "githubUser"
        ).value.trim();


    const repo =
        document.getElementById(
            "githubRepo"
        ).value.trim();


    const branch =
        document.getElementById(
            "githubBranch"
        ).value.trim() ||
        "main";


    const url =
        `https://api.github.com/repos/` +
        `${user}/${repo}/contents/${path}`;


    const text =
        JSON.stringify(
            data,
            null,
            2
        );


    const bytes =
        new TextEncoder()
        .encode(
            text
        );


    const content =
        arrayBufferToBase64(
            bytes
        );


    let sha;


    try {

        const old =
            await githubRequest(
                `${url}?ref=${branch}`
            );


        sha =
            old.sha;

    } catch(e) {}


    const body = {

        message,

        content,

        branch

    };


    if (sha)
        body.sha =
            sha;


    return githubRequest(
        url,
        {
            method: "PUT",
            body:
                JSON.stringify(
                    body
                )
        }
    );

}


/* =====================================================
   批量上传
===================================================== */

async function uploadAll() {

    if (!plugins.length) {

        alert(
            "没有插件"
        );

        return;

    }


    const button =
        document.getElementById(
            "uploadButton"
        );


    button.disabled =
        true;


    log(
        "\n========== 开始上传 =========="
    );


    const packages = [];


    try {

        for (
            let i = 0;
            i < plugins.length;
            i++
        ) {

            const plugin =
                plugins[i];


            log(
                `\n[${i + 1}/${plugins.length}] ` +
                `${plugin.name}`
            );


            /*
               DEB
            */

            const debPath =
                `debs/${plugin.deb.name}`;


            log(
                "上传 DEB..."
            );


            await uploadFile(
                debPath,
                plugin.deb,
                `Add ${plugin.name}`
            );


            /*
               图标
            */

            let iconPath =
                "";


            if (plugin.image) {

                iconPath =
                    `icons/${plugin.image.name}`;


                log(
                    "上传图标..."
                );


                await uploadFile(
                    iconPath,
                    plugin.image,
                    `Add icon ${plugin.name}`
                );

            }


            /*
               packages
            */

            packages.push({

                package:
                    plugin.package,

                name:
                    plugin.name,

                version:
                    plugin.version,

                author:
                    plugin.author,

                description:
                    plugin.description,

                architecture:
                    plugin.architecture,

                filename:
                    debPath,

                icon:
                    iconPath

            });


            log(
                `✅ ${plugin.name} 完成`
            );

        }


        /*
           生成 packages.json
        */

        log(
            "\n生成 packages.json..."
        );


        const data = {

            source: {

                name: "ilan",

                description:
                    "ilan RootHide 插件源",

                website:
                    "https://ilan621.github.io/Repo/"

            },

            packages

        };


        await uploadJSON(
            "packages.json",
            data,
            "Update packages.json"
        );


        log(
            "\n🎉 全部上传成功！"
        );


        alert(
            "🎉 插件源更新成功！"
        );


    } catch(error) {

        console.error(
            error
        );


        log(
            "\n❌ 上传失败：\n" +
            error.message
        );


        alert(
            "上传失败，请查看操作日志"
        );

    }


    button.disabled =
        false;

}

</script>
